<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esper Genesis – Fiches de personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0f1d33; --blue:#2f7fd8; --line:#c4d3e3; --field:#f7fafd; --ink:#16202e; --muted:#5b6b80; --page:#ffffff; --bg:#e9eef4;
  --vol:#2e8b57; --court:#2f6fb3; --long:#7a4fb3; --empl:#c77a1a; --perm:#6b7f95; --choix:#9aa5b1; --red:#c0261f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1220; } }
:root[data-theme="dark"]{ --bg:#0b1220; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); font-family:Lato, "Segoe UI", Arial, sans-serif; color:var(--ink); font-size:13px; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--navy); }
.toolbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--navy); color:#fff; display:flex; gap:10px; align-items:center; padding:10px 16px; flex-wrap:wrap; }
.toolbar b{ font-weight:900; letter-spacing:.02em; margin-right:auto; }
.toolbar button{ font:inherit; font-weight:700; border:0; border-radius:4px; padding:8px 14px; cursor:pointer; background:var(--blue); color:#fff; }
.toolbar button.ghost{ background:transparent; border:1px solid #6f89aa; }
.toolbar button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid #ffb547; outline-offset:1px; }
.status{ font-size:12px; color:#9cc3ee; }
main{ padding:18px 10px 40px; display:flex; flex-direction:column; align-items:center; gap:18px; }
.sheet{ width:210mm; max-width:100%; min-height:297mm; background:var(--page); box-shadow:0 2px 10px rgba(15,29,51,.18); padding:0 0 14px; overflow:hidden; color:#16202e; }
.band{ background:var(--navy); color:#fff; display:flex; gap:12px; padding:8px 12px; align-items:stretch; }
.band.small{ padding:10px 14px; align-items:center; }
.band.small h1{ font-size:20px; margin:0; font-weight:900; }
.band.small span{ color:#c9d8ea; font-size:12px; }
.avatar{ width:92px; height:92px; flex:none; border:0; padding:0; background:#1d2c45 center/cover no-repeat; cursor:pointer; border-radius:2px; }
.brand h1{ font-size:24px; margin:4px 0 0; font-weight:900; letter-spacing:.01em; }
.brand p{ margin:2px 0; font-size:12px; color:#c9d8ea; }
.hgrid{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:4px 8px; align-content:center; }
.hgrid label, .hgrid .hfield{ display:flex; flex-direction:column; font-size:9px; color:#9cc3ee; text-transform:none; gap:1px; }
.hgrid .hfield .lblrow label{ display:inline; }
.hgrid .hfield .lblrow label.sw{ display:inline-flex; flex-direction:row; align-items:center; }
.hgrid .hfield .lblrow{ height:11px; line-height:11px; overflow:visible; }
.band .sw{ gap:4px; } .band .sw i{ width:20px; height:11px; } .band .sw i::after{ top:1.5px; left:2px; width:8px; height:8px; } .band .sw input:checked + i::after{ left:10px; }
.sw i{ display:inline-block; }
.hgrid .hfield .sw{ display:inline-flex; flex-direction:row; }
.hgrid .pair{ display:flex; gap:6px; } .hgrid .pair label{ flex:1; } .hgrid .pair label:first-child{ flex:0 0 56px; }
input, select, textarea{ font:inherit; color:var(--ink); background:var(--field); border:1px solid #9fb3c8; border-radius:2px; padding:2px 4px; width:100%; min-width:0; }
textarea{ resize:vertical; line-height:1.35; }
.num{ text-align:center; font-weight:700; }
.title{ background:var(--navy); color:#fff; font-weight:900; font-size:11.5px; padding:3px 8px; border-radius:3px; margin:0 0 6px; }
.p1{ display:grid; grid-template-columns:150px 194px 1fr; grid-template-rows:auto 1fr; gap:8px; padding:10px 12px 0; }
.p1 > .right{ grid-column:3; grid-row:1 / 3; }
.panel{ border:1px solid var(--line); border-radius:4px; padding:5px 6px; margin-bottom:6px; background:#fff; }
.abil .nm{ font-weight:900; color:var(--navy); font-size:11px; } .abil .ac{ color:var(--muted); font-size:9px; margin-left:3px; }
.abil .row{ display:grid; grid-template-columns:38px 32px 1fr; gap:4px; align-items:end; margin-top:2px; }
.abil small{ display:block; font-size:9px; color:var(--muted); }
.abil .mod{ font-size:16px; height:32px; padding:2px 0; }
.abil .mt{ display:flex; gap:4px; align-items:center; font-size:9px; color:var(--muted); margin-top:3px; justify-content:flex-end; }
.abil .mt input{ width:auto; }
.headbox{ display:flex; justify-content:space-between; align-items:center; font-weight:900; color:var(--navy); font-size:11.5px; }
.headbox input{ width:32px; }
.skills .sk{ display:grid; grid-template-columns:14px 32px 1fr 26px; gap:4px; align-items:center; padding:2.7px 0; font-size:12px; }
.skills .sk input[type=checkbox]{ width:auto; margin:0; } .skills .sk em{ font-style:normal; color:var(--muted); font-size:9px; }
.combat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.combat3 .panel label, .pv label{ font-size:9.5px; font-weight:900; color:var(--navy); display:block; margin-bottom:2px; }
.big{ font-size:17px; height:30px; }
.pv{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.pv small{ font-size:9px; color:var(--muted); }
.misc{ display:grid; grid-template-columns:70px 1fr 64px; gap:8px; align-items:end; font-size:9.5px; }
.misc b{ color:var(--navy); font-size:9.5px; display:block; }
.misc .ds input{ width:auto; margin:0 2px 0 0; }
table{ width:100%; border-collapse:collapse; } th{ text-align:left; font-weight:400; font-size:9px; color:var(--muted); padding:1px 2px; }
td{ padding:1px 2px; } td input{ font-size:11px; }
.note{ font-size:9px; color:var(--muted); margin:2px 0 6px; }
.inv .head{ display:flex; justify-content:space-between; align-items:center; }
.inv .head input{ width:70px; text-align:right; color:#8a96a6; background:#fff; }
.inv .line{ display:grid; grid-template-columns:auto 1fr; gap:6px; border-bottom:1px solid #dde6f0; padding:1px 0; }
.inv .line input{ border:0; background:transparent; padding:1px 0; }
.inv .line .n{ font-weight:900; width:auto; } .inv .line .d{ font-style:italic; color:var(--muted); font-size:11px; }
.inv .line .bul{ display:none; }
.inv .line.sub{ padding-left:4px; } .inv .line.sub .n{ font-weight:400; }
.inv .line.sub .bul{ display:inline-block; border:0; background:none; color:var(--navy); font:inherit; font-weight:900; padding:0 6px 0 8px; cursor:pointer; }
.inv .line .nw{ display:flex; align-items:center; min-width:0; }
.inv .line .n{ min-width:28px; max-width:100%; flex:none; }
.bottom{ display:grid; grid-template-columns:1fr; gap:6px; grid-column:1 / 3; grid-row:2; align-content:start; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.prof .r{ display:grid; grid-template-columns:auto 1fr; gap:4px; align-items:center; border-bottom:1px solid #dde6f0; padding:2px 0; }
.prof .r b{ color:var(--navy); font-size:11.5px; } .prof .r input{ border:0; background:transparent; }
.esper3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.esper3 small{ display:block; font-size:9px; color:var(--muted); }
.slots{ display:grid; grid-template-columns:1.3fr repeat(4,1fr); gap:4px; margin-top:4px; }
.slot{ border:1px solid var(--line); border-radius:4px; padding:3px; text-align:center; }
.slot .lv{ font-weight:900; color:var(--navy); font-size:11px; } .slot .rk{ font-size:9px; color:var(--muted); }
.slot .bx{ display:flex; justify-content:center; gap:3px; margin:2px 0; } .slot .bx input{ width:auto; margin:0; }
.slot .dual{ display:grid; grid-template-columns:1fr 1fr; }
.slot .nt{ border:0; border-bottom:1px solid var(--line); background:transparent; font-size:9px; padding:0; margin-top:2px; }
/* page 2 */
.p2{ padding:10px 12px; }
.pers{ display:grid; grid-template-columns:60px 1fr; gap:4px 6px; align-items:center; margin-bottom:10px; }
.pers b{ font-weight:900; color:var(--navy); font-size:11px; }
.cols{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:10px; align-items:start; } input[list]::-webkit-calendar-picker-indicator{ display:none !important; opacity:0; } input[list]{ -moz-appearance:textfield; } .cols > div{ min-width:0; } .cols select, .cols .featrow select{ max-width:100%; } .featrow{ flex-wrap:wrap; }
.sec{ font-weight:900; color:var(--navy); border-bottom:2px solid var(--blue); padding:2px 0; margin:6px 0 5px; font-size:12px; }
.card{ border:1px solid var(--line); border-radius:3px; margin-bottom:5px; background:#fbfcfe; break-inside:avoid; }
.card .hd{ display:flex; background:var(--navy); color:#fff; align-items:stretch; min-height:22px; }
.card .hd input.t{ background:transparent; border:0; color:#fff; font-weight:900; flex:1; padding:3px 6px; font-size:12px; }
.card .hd select.badge{ border:0; color:#fff; font-weight:900; font-size:10px; flex:0 0 40%; text-align:right; padding:0 6px; border-radius:0; }
.card textarea{ border:0; background:transparent; font-size:12px; min-height:20px; overflow:hidden; resize:none; }
.b-vol{ background:var(--vol)!important; } .b-court{ background:var(--court)!important; } .b-long{ background:var(--long)!important; }
.b-empl{ background:var(--empl)!important; } .b-perm{ background:var(--perm)!important; } .b-choix{ background:var(--choix)!important; }
/* page 3 power cards */
.pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; padding:10px 12px; }
.pcard{ border:1px solid var(--line); border-radius:3px; background:#fbfcfe; min-height:118px; display:flex; flex-direction:column; break-inside:avoid; }
.pcard .hd{ display:flex; background:var(--navy); color:#fff; align-items:center; min-height:32px; }
.pcard .hd.bad{ background:#8a1f1f; }
.pcard .hd input[type=checkbox]{ width:auto; margin:0 4px 0 6px; accent-color:#fff; }
.pcard .hd select{ background:transparent; color:#fff; border:0; font-weight:900; font-size:12px; padding:2px 2px; }
.pcard .hd .namebtn{ flex:1; min-width:0; text-align:left; background:transparent; color:#fff; border:0; font:inherit; font-weight:900; font-size:12px; padding:2px 18px 2px 4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; }
.pcard .hd .namebtn:not(:disabled)::after{ content:"▾"; position:absolute; right:4px; top:50%; transform:translateY(-50%); font-size:11px; }
.exporting .pcard .hd .namebtn::after{ display:none; }
.picker{ position:fixed; z-index:70; display:flex; background:#fff; color:#16202e; border:1px solid #b8c6d6; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.28); max-height:min(70vh, 520px); width:min(720px, calc(100vw - 16px)); overflow:hidden; }
.picker .pl{ flex:0 0 46%; overflow:auto; border-right:1px solid #dde6f0; }
.picker .pvw{ flex:1; overflow:auto; padding:12px 16px; font-size:15px; line-height:1.5; display:block; }
.picker .pvw h3{ margin:0 0 4px; font-size:20px; color:var(--navy); } .picker .pvw .m1{ color:#7d8a9b; font-size:12.5px; } .picker .pvw .m2{ font-weight:700; font-size:14px; margin:4px 0 10px; } .picker .pvw .why{ color:var(--red); font-weight:700; margin-top:8px; }
.picker .tags{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 2px; } .picker .tag{ font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:10px; background:#e3ebf4; color:#0f1d33; } .picker .tag.sub{ background:#fdf0e3; color:#8a4a12; }
.picker .grp{ position:sticky; top:0; background:#e3ebf4; color:#0f1d33; font-weight:900; font-size:11.5px; padding:4px 8px; }
.picker .it{ display:block; width:100%; text-align:left; border:0; background:none; font:inherit; font-size:12.5px; padding:5px 10px; cursor:pointer; color:#16202e; }
.picker .it:hover, .picker .it:focus, .picker .it.cur{ background:var(--blue); color:#fff; outline:none; }
.picker .it.dis{ color:#9aa5b1; cursor:not-allowed; } .picker .it.dis:hover, .picker .it.dis:focus{ background:#eef3f9; color:#6b7785; }
@media (max-width:640px){ .picker{ flex-direction:column; } .picker .pl{ flex:0 0 55%; border-right:0; border-bottom:1px solid #dde6f0; } }
.pcard .hd select option{ color:#16202e; background:#fff; font-weight:400; }
.pcard .hd select option:disabled{ color:#9aa5b1; }
.pcard .hd select optgroup{ color:#0f1d33; background:#e3ebf4; font-weight:900; font-style:normal; }
.pcard .hd .lvl{ flex:0 0 66px; } .pcard .hd .name{ flex:1; min-width:0; }
.pcard .hd .type{ flex:0 0 27%; align-self:stretch; display:flex; align-items:center; justify-content:flex-end; text-align:right; line-height:1.15; padding:0 6px; font-weight:900; font-size:9.5px; }
.band.small .bandbtn{ margin-left:auto; font:inherit; font-weight:700; border:0; border-radius:4px; padding:7px 12px; cursor:pointer; background:var(--blue); color:#fff; }
.exporting .bandbtn{ display:none; }
.pcard .mid{ display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:4px; padding:2px 6px 0; align-items:start; }
.pcard .src{ font-size:10px; color:#8a96a6; } .pcard .meta{ font-size:11px; font-weight:900; color:var(--navy); }
.pcard .uc{ border:1px solid #9fb3c8; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:3px; padding:2px 3px; min-height:0; max-width:92px; }
.pcard .uc input{ width:auto; margin:0; } .pcard .uc.hide{ display:none; } .pcard .src[data-jump]{ cursor:pointer; } .pcard .src[data-jump]:hover{ color:var(--blue); text-decoration:underline; }
.pcard .desc{ padding:3px 6px 5px; font-size:12px; line-height:1.35; flex:1; outline:none; }
.pcard .desc .ev{ color:var(--red); font-weight:700; }
.pcard .why{ font-size:10px; color:#b0251f; padding:0 6px 4px; }
.addrow{ grid-column:1 / 3; display:flex; gap:10px; align-items:center; }
.addrow button{ font:inherit; font-weight:700; border:1px dashed var(--blue); background:#fff; color:var(--blue); padding:8px 14px; border-radius:4px; cursor:pointer; }
.manual{ padding:0 12px 10px; }
@media (max-width:820px){
  .p1{ grid-template-columns:1fr 1fr; } .p1 > .right{ grid-column:1 / 3; grid-row:auto; } .bottom{ grid-row:auto; }
  .hgrid{ grid-template-columns:1fr 1fr; } .cols, .pgrid{ grid-template-columns:1fr; } .addrow{ grid-column:1; }
}
@media print{ .toolbar{ display:none; } body{ background:#fff; } main{ padding:0; gap:0; } .sheet{ box-shadow:none; page-break-after:always; } }
.exporting .addrow, .exporting .why:empty{ display:none; }

.toolbar select{ font:inherit; background:#1d2c45; color:#fff; border:1px solid #6f89aa; border-radius:4px; padding:7px 8px; width:auto; max-width:220px; }
.toolbar .grp{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-left:auto; }
.toolbar{ justify-content:flex-end; }
.toolbar .status{ margin-left:auto; text-align:right; }
.abil .g3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px 5px; align-items:end; margin-top:3px; }
.abil .g3 label{ display:flex; flex-direction:column; font-size:9px; color:var(--muted); gap:1px; text-align:center; }
.abil .g3 input{ height:22px; padding:0 2px; font-size:13px; }
.abil .g3 .tot, .abil .g3 .mod{ font-weight:900; font-size:14px; }
.abil .g3 .rv{ height:22px; display:flex; align-items:center; justify-content:center; gap:3px; font-weight:700; color:var(--navy); font-size:12px; }
.abil .g3 .lib{ width:24px; height:18px; font-size:10px; }
.abil .g3 .mt2{ justify-content:flex-end; } .abil .g3 .mt2 span{ height:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:8.5px; line-height:1.05; text-align:center; }
.abil .g3 .mt2 input{ width:13px; height:13px; flex:none; margin:0; padding:0; }
.abil .row3{ display:grid; grid-template-columns:34px 28px 24px minmax(0,1fr); gap:3px; align-items:end; margin-top:2px; }
.skcol{ display:flex; flex-direction:column; }
.skcol .cub{ flex:1; display:flex; padding:5px; margin-bottom:0; min-height:44px; }
.cubin{ flex:1; width:100%; height:auto; font-weight:900; color:var(--navy); text-transform:uppercase; text-align:center; letter-spacing:.02em; }
textarea.ag{ resize:none; overflow:hidden; min-height:0; line-height:1.3; padding-top:2px; padding-bottom:2px; }
.pers{ gap:3px 6px !important; margin-bottom:8px !important; }
.card .ce{ padding:3px 6px; font-size:12px; line-height:1.35; min-height:36px; outline:none; }
.card .ce .ev{ color:var(--red); font-weight:700; }
.asirow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:3px 0; } .asirow b{ color:var(--navy); min-width:46px; } .asirow select{ width:auto; }
.asirow .note{ margin:0; flex-basis:100%; }
.resrow{ display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; border-bottom:1px solid #dde6f0; padding:3px 0; font-size:12px; }
.resrow b{ color:var(--navy); } .resrow span{ display:flex; gap:4px; align-items:center; } .resrow input[type=checkbox]{ width:auto; margin:0; } .resrow em{ grid-column:1 / 3; font-style:normal; font-size:10px; color:var(--muted); }
.pstat{ margin-top:6px; } .psr{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 6px; border:1px solid var(--line); border-radius:3px; margin-bottom:4px; font-size:11.5px; }
.psr.miss{ border-color:#e3a19c; background:#fdf1f0; color:#8a1f1f; } .psr b{ font-weight:900; }
.exporting .psr button{ display:none; }
.avatar.empty{ background:#1d2c45; border:1px dashed #6f89aa; color:#9cc3ee; font:inherit; font-size:11px; font-weight:700; }
.grpt{ border-collapse:collapse; width:100%; font-size:12.5px; } .grpt th{ background:var(--navy); color:#fff; text-align:left; padding:5px 6px; font-size:11px; white-space:nowrap; }
.grpt td{ border-bottom:1px solid #dde6f0; padding:5px 6px; vertical-align:top; } .grpt small{ color:var(--muted); }
.grpt .lnk{ border:0; background:none; padding:0; color:var(--blue); font:inherit; font-weight:900; cursor:pointer; text-decoration:underline; }
.pcard .pg{ display:flex; align-items:center; gap:4px; font-size:10.5px; color:#5d6b7c; font-weight:700; margin:1px 0; } .pcard .pg .bk{ width:12px; height:12px; flex:none; }
.grpt td .pj{ font-style:italic; font-weight:900; font-size:12px; color:var(--navy); } .grpt td .rc{ font-style:italic; }
.modal .box button.lnk{ background:none; color:var(--blue); padding:0; border:0; font-weight:900; text-decoration:underline; }
.ghead{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; } .ghead h2{ margin:0; }
.sw{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; font-weight:700; user-select:none; }
.sw input{ position:absolute; opacity:0; width:1px; height:1px; }
.sw i{ width:28px; height:16px; border-radius:9px; background:#b8c6d6; position:relative; transition:background .15s; flex:none; }
.sw i::after{ content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:left .15s; }
.sw input:checked + i{ background:var(--blue); } .sw input:checked + i::after{ left:14px; }
.sw input:focus-visible + i{ outline:2px solid #ffb547; outline-offset:1px; }
.lblrow{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.band .sw{ color:#cfe0f3; font-size:10px; }
.exporting .band .sw{ display:none; }
.manual{ position:fixed; right:0; top:var(--tbh, 56px); bottom:0; width:var(--manw, 33.333vw); min-width:280px; z-index:15; background:#2b3442; display:flex; flex-direction:column; border-left:2px solid var(--navy); box-shadow:-4px 0 14px rgba(0,0,0,.2); }
.manual .mgrip{ position:absolute; left:-6px; top:0; bottom:0; width:10px; cursor:ew-resize; z-index:2; }
.manual .mgrip::after{ content:""; position:absolute; left:3px; top:50%; width:4px; height:48px; transform:translateY(-50%); border-radius:2px; background:#6f89aa; }
.manual .mgrip:hover::after, .manual .mgrip:focus-visible::after, body.mresizing .manual .mgrip::after{ background:#ffb547; }

const FR_P = {"Absorption": "Une créature consentante touchée obtient la résistance à un type de dégâts au choix : acide, froid, feu, foudre ou tonnerre.", "Alter Appearance": "Tu modifies ton apparence (vêtements et équipement compris) : 30 cm de plus ou de moins, plus mince ou plus large, même morphologie. L'illusion ne résiste pas au toucher ; la percer : action + test d'INT (Investigation) contre ton DD.", "Alter Form": "Tu prends une forme au choix (changeable par une action) : adaptation aquatique (respiration sous l'eau, nage = vitesse), changement d'apparence (même taille et silhouette), adaptation à la basse gravité, et autres options du livre.", "Aspect of Dread": "Une créature visible : sauvegarde de WIS ou effrayée. À la fin de chacun de ses tours, nouvelle sauvegarde de WIS : échec = 4d10 psychiques, réussite = fin de l'effet. Sans effet sur automates et constructions. +1d10 par rang au-dessus de 4.", "Assault Drone": "Un drone découpeur que tu contrôles : à l'activation, déplace-le et fais une attaque de forge au corps à corps (1d8 + mod. de forge radiants) contre une créature à 1,5 m de lui. Action bonus : déplacement de 6 m et nouvelle attaque. +1d8 tous les deux rangs au-dessus de 2.", "Atmospheric Adaptation": "Jusqu'à 10 créatures consentantes visibles respirent normalement sans air (vide, sous l'eau). Ne protège pas des toxines, gaz ou pouvoirs similaires.", "Attack Pattern": "Des drones mitraillent une zone de 6 x 3 x 3 m : sauvegarde de DEX, 3d8 feu et force (moitié si réussite). Ton action à chaque tour : nouvelle attaque, même zone ou autre. +1d8 par rang au-dessus de 3.", "Augment Ability": "Une créature touchée gagne un bonus au choix : avantage aux tests de DEX (pas de dégâts de chute ≤ 6 m), CHA, STR (charge doublée), INT, CON (+2d6 PV temporaires) ou WIS. +1 cible par rang au-dessus de 2.", "Barrage": "Un autocanon tire dans un cône de 18 m : sauvegarde de DEX, 3d8 perforants (moitié si réussite). +1d8 tous les deux rangs au-dessus de 3.", "Barrier": "Un champ de force entoure une créature à portée : +2 à la CA pendant la durée.", "Basic Construct": "Des constructions amies apparaissent : 1 de FP 2, 2 de FP 1, 4 de FP 1/2 ou 8 de FP 1/4. Elles agissent ensemble et obéissent à tes ordres vocaux ; le MG fournit leurs statistiques. Rangs supérieurs : plus nombreuses (x2 au rang 6, x3 au rang 8).", "Bastion": "Réaction quand tu es touché : +5 à la CA jusqu'au début de ton prochain tour, y compris contre l'attaque déclenchante ; compte aussi comme un PSD.", "Beguile": "Un humanoïde visible : sauvegarde de WIS (avantage si vous le combattez) ou charmé, il te voit en ami jusqu'à la fin ou tant que vous ne lui nuisez pas. À la fin, nouvelle sauvegarde de WIS pour comprendre qu'il a été charmé. +1 cible par rang au-dessus de 1 (à 9 m les unes des autres).", "Bishop's Deviation": "Les créatures choisies qui t'entendent : sauvegarde de WIS ou affectées. En action bonus à chacun de tes tours, tu désignes une direction horizontale : elles doivent s'y déplacer au maximum (elles peuvent agir avant). Après ce déplacement, nouvelle sauvegarde de WIS pour mettre fin à l'effet.", "Blinding Strike": "Ta prochaine attaque d'arme réussie inflige +3d8 radiants ; la cible fait une sauvegarde de CON ou est aveuglée (nouvelle sauvegarde à la fin de chacun de ses tours).", "Bolster": "Jusqu'à 3 créatures à portée : PV max et actuels +5 pendant la durée. +5 supplémentaires par rang au-dessus de 2.", "Churning Pit": "Fosse de boue de 9 m de rayon (terrain difficile). Une créature qui y commence son tour : sauvegarde de STR ou 6d6 contondants et attirée de 3 m vers le centre ; au centre, nouvelle sauvegarde de STR ou à terre.", "Clean Zone": "Sphère de 3 m de rayon centrée sur toi : tu éteins les flammes non protégées, filtres gaz et toxines aériennes, et retires l'état empoisonné aux créatures dans la sphère.", "Commune with Beasts": "Tu comprends les bêtes et leur parles : elles te renseignent sur les lieux et menaces perçus depuis un jour ; un petit service est possible (MG).", "Conduit Transfer": "Tu touches un appareil relié à un conduit d'énergie ou de données et te téléportes à un autre appareil visible relié au même réseau, à 1,5 m de lui (5 m... 1,5 m de déplacement requis).", "Control Matrix": "Un automate ou une construction visible : sauvegarde d'INT (avantage si vous le combattez) ou sous ton contrôle. Lien télépathique : ordres simples sans action ; avec ton action, contrôle total jusqu'à la fin de ton prochain tour.", "Corrupt Pattern": "Attaque de canalisation au contact, puis sauvegarde de WIS ou motif corrompu. Au choix : désavantage aux tests et sauvegardes d'une caractéristique ; désavantage à ses attaques contre toi ; sauvegarde de WIS en début de tour ou action perdue ; ou +1d8 nécrotiques de tes attaques et pouvoirs. Rang 4+ : durée 10 min (plus au rang supérieur).", "Cortex Link": "Un appareil sur une créature consentante crée un lien : à 18 m de toi, elle a +1 à la CA et aux sauvegardes et la résistance à tous les dégâts, mais tu subis autant de dégâts qu'elle. Tu perçois ses émotions. Fin si tu tombes à 0 PV ou à plus de 18 m.", "Cosmic Ward": "Zone protégée jusqu'à 18 m de rayon : les êtres d'énergie (primordiaux, protéens, netherants) ne peuvent y entrer ni y charmer, effrayer ou posséder. Tu y lies en plus un effet de la liste du livre (ou proposé par le MG).", "Daze": "Les créatures à 6 m d'un point à portée : sauvegarde de WIS ou confuses et entravées jusqu'à la fin de leur prochain tour ; en cas de réussite, immunisées 24 h. Sans effet sur automates, constructions et créatures immunisées au charme.", "Debilitating Strike": "Ta prochaine attaque d'arme réussie inflige +4d6 psychiques ; sauvegarde de WIS ou désavantage aux attaques et tests, et pas de réaction, jusqu'à la fin de son prochain tour.", "Dermal Overlay": "Une créature consentante touchée : sa CA ne peut pas être inférieure à 16, quelle que soit son armure.", "Detect Thoughts": "Ton action à chaque tour : tu lis les pensées de surface d'une créature visible à 9 m (INT 4+, parlant une langue). Action : changer de cible ou sonder plus loin (sauvegarde de WIS ; échec = raisonnement, émotions, préoccupation majeure).", "Detect Truth": "Sphère de 4,5 m de rayon : une créature qui y entre ou y commence son tour fait une sauvegarde de CHA ; échec = elle ne peut pas mentir délibérément. Tu sais qui a réussi ; elle peut rester évasive.", "Detoxify": "Neutralise un poison sur la créature ; pendant la durée, avantage aux sauvegardes contre l'empoisonnement et résistance au poison.", "Dimensional Container": "Tu caches un contenant (jusqu'à 0,35 m³ d'objets non vivants) dans une poche dimensionnelle, lié à un petit objet non électronique. Action + toucher l'objet : rappeler ou renvoyer le contenant. Après 60 jours, 5 % de risque cumulatif par jour de perte de l'effet.", "Dimensional Pocket": "Entrée invisible jusqu'à 18 m au-dessus de toi vers un espace extradimensionnel (8 créatures moyennes max). Une créature à la fois, entrer en se plaçant dessous ; sortir = action. Ni attaques ni pouvoirs ne traversent ; on voit dehors par une fenêtre de 1 x 1,5 m.", "Disruption Wave": "Attaque de canalisation à distance : 4d4 nécrotiques, puis 2d4 à la fin de son prochain tour ; raté : moitié des dégâts initiaux seulement. +1d4 (aux deux) par rang au-dessus de 2.", "Disruptive Strike": "Ta prochaine attaque au corps à corps réussie inflige +1d6 nécrotiques ; sauvegarde de CON ou désavantage aux sauvegardes de STR et DEX jusqu'à la fin de son prochain tour.", "Dream Weave": "Toi ou un messager consentant entrez en transe pour visiter les rêves d'une créature connue dans le même système stellaire (pas les belare) : conversation et décor du rêve modelés ; la cible s'en souvient au réveil. Possibilité de rêve terrifiant (détails p. 228).", "Emergency Camp": "Dôme de force de 3 m de rayon (toi + 9 créatures moyennes) pendant la durée ; rien d'autre ne le traverse, ni les pouvoirs. Intérieur confortable, sombre ou faiblement éclairé, opaque vu de l'extérieur. Fin si tu en sors.", "Emergency Ration": "Tu crées 10 barres de ration : une action pour en manger une, elle rend 1 PV et nourrit 24 h. Elles se désagrègent après 24 h.", "Energy Susceptibility": "Une créature visible : sauvegarde de CON ou affectée. Choisis acide, froid, feu, foudre ou poison : la première fois de chaque tour qu'elle subit ce type, +2d6 de ce type, et elle perd sa résistance à ce type. +1 cible par rang au-dessus de 4 (à 9 m les unes des autres).", "Enhance Weapon": "Une arme ordinaire touchée devient améliorée : +1 aux jets d'attaque et de dégâts (+2 au rang 4, +3 au rang 6).", "Enthrall": "Les créatures choisies qui t'entendent : sauvegarde de WIS (avantage si vous les combattez, réussite auto si immunisées au charme). Échec : désavantage aux tests de Perception pour percevoir autre que toi, tant qu'elles t'entendent.", "Esper Sense": "Tu perçois les pouvoirs esper à 9 m ; action : voir l'aura des créatures et objets affectés et leur domaine. Bloqué par 30 cm de pierre ou métal, ou 90 cm de terre ou bois.", "Field Lancer": "Micro-drones dans un rayon de 6 m : terrain difficile ; une créature qui s'y déplace subit 2d4 perforants par 1,5 m parcouru. Camouflés : sans les voir à l'activation, test de WIS (Perception) contre ton DD pour repérer le danger.", "Field Repair": "Jusqu'à 3 automates, constructions ou appareils (véhicules planétaires compris) visibles regagnent 1d4 + mod. de forge PV. +1d4 par rang au-dessus de 3.", "Field Salve": "3 créatures visibles regagnent 1d4 + mod. de forge PV (sans effet sur automates et constructions). +1d4 par rang au-dessus de 1.", "Flame Blast": "Ligne de feu de 30 m x 1,5 m : sauvegarde de DEX, 8d6 feu (moitié si réussite) ; enflamme les objets non portés. +1d6 par rang au-dessus de 3.", "Flaming Discs": "3 disques de feu au-dessus de toi : à l'activation ou en action bonus, lance-en autant que voulu (une attaque de canalisation à distance chacun) : 2d6 feu par disque. +1 disque par rang au-dessus de 2.", "Force Field": "Barrière invisible indestructible (sphère ou dôme de 3 m de rayon, ou 10 panneaux de 3 x 3 m) : rien ne la traverse physiquement, immunisée aux dégâts et à Unravel Effect.", "Frigid Mist": "Nuage de brume glacée de 6 m de rayon (zone très obscurcie) : y entrer ou y commencer son tour = sauvegarde de CON, 5d8 froid (moitié si réussite). Le nuage s'éloigne de toi de 3 m à chacun de tes tours.", "Graviton Strike": "Ta prochaine attaque d'arme réussie crée un champ de gravité : sauvegarde de STR (avantage si Grande ou plus) ou entravée ; 1d6 force au début de chacun de ses tours. Libération : action + test de STR contre ton DD. +1d6 par rang au-dessus de 1.", "Gravity Well": "Anneau de force de 6 m de diamètre (terrain difficile) : y entrer ou y commencer son tour = sauvegarde de DEX ou 3d6 force et entravé ; entravé au début de son tour = 3d6 force. Libération : action + test de STR ou DEX contre ton DD.", "Horrific Visage": "Cône de 9 m : sauvegarde de WIS ou la créature lâche ce qu'elle tient et est effrayée ; elle doit Foncer pour s'éloigner à chaque tour. Hors de ta vue en fin de tour : nouvelle sauvegarde pour mettre fin à l'effet.", "Illusory Design": "Image réaliste (cube de 6 m max) avec sons, odeurs et température, sans dégâts. Action : la déplacer. Interaction physique = illusion révélée ; examen : test d'INT (Investigation) contre ton DD.", "Illusory Form": "Image purement visuelle (cube de 4,5 m max) ; action : la déplacer. Elle se révèle au toucher ; examen : test d'INT (Investigation) contre ton DD.", "Imbue Intellect": "Une bête ou une plante (Très Grande ou moins, INT 3 ou moins) obtient INT 10 et une langue que tu parles ; une plante peut bouger et percevoir. Charmée par toi 30 jours ; elle choisit ensuite son attitude.", "Impact Drive": "Ta première attaque d'arme réussie pendant la durée inflige +1d6 force ; sauvegarde de STR ou la cible tombe à terre.", "Impact Zone": "Explosion dans un cube de 4,5 m : sauvegarde de DEX, 3d10 force (moitié si réussite) ; en cas d'échec, à terre et pas d'action bonus jusqu'à la fin de ton prochain tour. +1d10 par rang au-dessus de 3.", "Impedance": "Jusqu'à 3 créatures visibles : sauvegarde de WIS ou -2 à tous leurs jets d'attaque et de sauvegarde pendant la durée. +1 cible par rang au-dessus de 1.", "Imposing Influence": "Un humanoïde visible : sauvegarde de WIS ou charmé ; à chacun de ses tours, tu peux le forcer à attaquer au corps à corps une créature de ton choix. Maintien : ton action à chaque tour. Nouvelle sauvegarde à la fin de chacun de ses tours.", "Infravision": "Une créature consentante touchée voit dans l'infrarouge jusqu'à 18 m, et bascule librement avec la vision normale.", "Innervate": "Tu gagnes 1d4 + 4 PV temporaires pendant la durée. +5 PV temporaires par rang au-dessus de 1.", "Instant Recall": "Mémoire quasi eidétique : +10 aux tests d'INT pour te souvenir d'événements vécus, et avantage aux tests d'Investigation ou de Perspicacité qui s'appuient sur ces souvenirs.", "Jolting Strike": "Ta prochaine attaque d'arme à distance devient un éclair : 4d8 foudre si elle touche (moitié si elle rate), et chaque créature à 3 m de la cible fait une sauvegarde de DEX : 2d8 foudre (moitié si réussite). +1d8 par rang au-dessus de 3 (aux deux effets).", "Jump": "La créature touchée triple sa distance de saut pendant la durée.", "Laser Blast": "Attaque de forge à distance : 4d6 radiants, et la prochaine attaque contre la cible avant la fin de ton prochain tour a l'avantage. +1d6 par rang au-dessus de 1.", "Loading Arm": "Un bras cybernétique sur une créature consentante : avantage aux tests de STR (Athlétisme) pour déplacer, soulever ou porter, comme si elle était d'une taille au-dessus.", "Magnetic Seal": "Une porte, trappe ou un contenant touché est verrouillé pendant la durée (toi et les créatures désignées l'ouvrent normalement ; mot de passe possible). DD pour le forcer +10 ; Lock Breaker le neutralise 10 min.", "Major Field Repair": "Jusqu'à 4 automates, constructions ou appareils visibles regagnent 1d8 + mod. de forge PV. +1d8 par rang au-dessus de 5.", "Major Field Salve": "Jusqu'à 6 créatures visibles regagnent 1d4 + mod. de forge PV (sans effet sur automates et constructions). +1d4 par rang au-dessus de 3.", "Major Remedy": "Soin d'une créature : réduit l'épuisement d'un niveau, ou met fin à un effet de charme ou de pétrification, une affliction due à un talent ou une technique, une réduction de caractéristique ou de PV max.", "Mass Mend": "Jusqu'à 6 créatures dans une sphère de 9 m de rayon regagnent 3d8 + mod. de forge PV (sans effet sur automates et constructions). +1d8 par rang au-dessus de 5.", "Mass Treatment": "Jusqu'à 6 créatures visibles regagnent 2d8 + mod. de forge PV (sans effet sur automates et constructions). +1d8 par rang au-dessus de 2.", "Medical Unit": "Un drone médical te suit pendant la durée : en action bonus, il soigne une créature à 9 m (toi compris) de 2d6 PV.", "Mend": "Une créature touchée regagne 1d8 + mod. de forge PV (sans effet sur automates et constructions). +1d8 par rang au-dessus de 1.", "Micro Stabilizer": "La première fois que la cible devrait tomber à 0 PV, elle reste à 1 PV ; un effet qui la tuerait instantanément sans dégâts est annulé. L'effet prend fin ensuite.", "Minor Remedy": "Met fin à une maladie ou à un état sur la créature : aveuglé, assourdi, paralysé ou empoisonné.", "Modify Memory": "Une créature visible : sauvegarde de WIS (avantage si vous la combattez) ou charmée et neutralisée. Tu modifies son souvenir d'un événement de moins de 10 min vécu dans les 24 h (effacer, préciser ou changer). Fin si elle subit des dégâts ou un autre pouvoir.", "Molecular Agitation": "Un objet manufacturé en métal ou plastique renforcé (arme, armure, boîtier) chauffe : une créature en contact subit 2d8 feu, et de nouveau en action bonus à tes tours suivants ; celle qui le tient ou le porte fait une sauvegarde de CON ou le lâche (sinon désavantage).", "Nondetection": "La cible touchée (créature, lieu ou objet de 3 m max) ne peut pas être ciblée par les pouvoirs de clairsentience, les techniques de forge ou les objets de détection améliorés.", "Optimizer": "Les créatures choisies à portée ont l'avantage aux sauvegardes de WIS et contre la mort, et regagnent le maximum possible de PV de tout soin.", "Pacify": "Humanoïdes dans une sphère de 6 m de rayon : sauvegarde de CHA (échec volontaire possible). Échec : suspend un effet de charme ou de peur, ou rend indifférent envers les créatures choisies (prend fin si attaqué ou si un ami est blessé).", "Paralyzer": "Un filet électrique : sauvegarde de CON ou paralysé ; nouvelle sauvegarde à la fin de chacun de ses tours. +1 humanoïde ciblé par rang au-dessus de 2 (à 9 m les uns des autres).", "Pass without Trace": "Toi et les créatures choisies à 9 m : +10 aux tests de DEX (Discrétion) et aucune trace ; pistage impossible sauf par un pouvoir esper.", "Personal Sentry": "Drones furtifs dans un rayon de 4,5 m autour de toi (créatures désignées épargnées) : vitesse réduite de moitié, et y entrer ou y commencer son tour = sauvegarde de WIS, 3d8 radiants (moitié si réussite). +1d8 par rang au-dessus de 3.", "Plasma Orb": "Sphère d'énergie de 6 m de rayon (terrain difficile) : y apparaître ou y finir son tour = sauvegarde de CON ou 2d6 radiants. Action bonus : éclair depuis le centre sur une cible à 18 m (attaque de forge à distance, avantage si elle est dans la sphère) : 4d6 foudre.", "Primal Fear": "Une créature visible (INT 5+) : sauvegarde de WIS ou à terre et neutralisée, incapable de se relever. Nouvelle sauvegarde à la fin de chacun de ses tours et à chaque dégât subi (avec avantage).", "Projected Force": "Sphère de force (CA 20, PV = tes PV max, STR 26) qui obéit à ta main. À l'activation et en action bonus : déplace-la de 18 m, puis frappe (attaque de canalisation au corps à corps, dégâts de force), agrippe, pousse ou soulève une créature ou un objet (options p. 252).", "Protection Field": "Champ de force corporel : ta CA de base devient 13 + mod. DEX et compte comme un PSD contre les armes cinétiques. Sans armure ni équipement de protection ; arrêt par une action.", "Protective Sphere": "Sphère de force autour d'une créature ou d'un objet (Grand max ; sauvegarde de DEX si non consentant) : rien n'entre ni ne sort, immunisée aux dégâts. La créature à l'intérieur peut la faire rouler à demi-vitesse.", "Psychic Backlash": "Réaction quand une créature visible à 18 m te blesse : sauvegarde de DEX, 2d10 psychiques (moitié si réussite). +1d10 par rang au-dessus de 1.", "Psychic Wave": "Cône de 4,5 m : sauvegarde de WIS, 3d6 psychiques (moitié si réussite). +1d6 par rang au-dessus de 2.", "Pulse Beam": "Rayon ionique de 18 m x 1,5 m : sauvegarde de DEX. Automates et constructions : 5d6 foudre et étourdis jusqu'à la fin de leur prochain tour (moitié sans étourdissement si réussite). Échec : appareils électroniques inutilisables 1 min, armes à énergie inutilisables jusqu'à la fin de son prochain tour. +1d8 par rang au-dessus de 3.", "Pulsing Strike": "Ta prochaine attaque d'arme réussie fixe un appareil sur la cible : au début de chacun de ses tours, sauvegarde de CON ou 1d6 foudre ; réussite = fin. Une action (la sienne ou d'une créature à 1,5 m) retire l'appareil.", "Quick Construct": "Tu crées une construction robotique humanoïde (Petite ou Moyenne, statistiques de construction forgée chez le MG). Action bonus : la commander à 18 m (action et déplacement) ; sans ordre, elle se défend seulement.", "Quick Repair": "Un automate, une construction, un appareil ou un véhicule touché regagne 1d8 + mod. de forge PV. +1d8 par rang au-dessus de 2.", "Quick Step": "La créature touchée gagne +3 m de vitesse pendant la durée. +1 cible par rang au-dessus de 1.", "Ramming Strike": "Ta première attaque au corps à corps réussie inflige +2d6 tonnerre (audible à 90 m) ; sauvegarde de STR ou la cible est repoussée de 3 m et à terre.", "Resuscitate": "Une créature morte depuis moins d'une minute revient à la vie avec 1 PV (pas de mort de vieillesse ni de membre manquant).", "Revive": "Ramène à la vie une créature morte depuis 10 jours max, avec 1 PV ; neutralise poisons et maladies, ferme les blessures mortelles (pas les membres manquants, pas les automates). Retour pénible : -4 aux jets, réduit à chaque repos long.", "Salvo Strike": "Un drone mitraille un cylindre de 12 m de rayon et 6 m de haut : sauvegarde de DEX, 8d8 perforants (moitié si réussite).", "Scorching Strike": "Ta prochaine attaque au corps à corps réussie inflige +1d6 feu et enflamme la cible : au début de chacun de ses tours, sauvegarde de CON ou 1d6 feu ; réussite ou action pour éteindre = fin. +1d6 aux dégâts initiaux par rang au-dessus de 1.", "Secure Zone": "Cube de 1,5 à 30 m de côté, propriétés au choix : sons bloqués, bord opaque (même infravision), capteurs bloqués, pas de clairsentience, pas de téléportation ni de passage dimensionnel.", "Security Scanner": "Tu détectes la présence de pièges en vue à portée (mines, grilles de capteurs, armes cachées, pièges de pouvoirs), et leur nature générale, sans leur emplacement exact.", "Sensor Trigger": "Alarme sur une porte, fenêtre ou zone (cube de 6 m max) : te prévient quand une créature Très Petite ou plus y entre (créatures désignées exclues). Mentale (ping à 1,6 km, te réveille) ou sonore (sirène 10 s audible à 18 m).", "Sensory Boost": "Jusqu'à 3 créatures à portée : +2 aux jets d'attaque et de sauvegarde pendant la durée. +1 cible par rang au-dessus de 1.", "Sensory Extension": "Capteur invisible dans un lieu connu ou évident à portée : tu vois ou entends depuis ce point ; action pour changer de sens.", "Sensory Jammer": "Une créature à portée devient difficile à cibler : quiconque l'attaque ou la cible d'un pouvoir nuisible fait d'abord une sauvegarde de WIS ; échec = changer de cible ou perdre l'attaque. Ne protège pas des effets de zone.", "Shared Vision": "Tu partages un souvenir (30 jours max, 1 min max) avec jusqu'à 4 créatures consentantes : vue, son et odeur. Avantage aux tests de Perception liés à ce souvenir. Mêmes cibles : une fois par 24 h.", "Shrapnel Cloud": "Ta prochaine attaque à distance réussie libère des fléchettes : la cible et chaque créature à 1,5 m d'elle font une sauvegarde de DEX, 1d10 perforants (moitié si réussite). +1d10 par rang au-dessus de 1 (6d10 max).", "Slow Fall": "Réaction quand une créature à 18 m tombe : jusqu'à 5 créatures descendent de 18 m par round seulement et atterrissent sans dégâts.", "Sound Dampener": "Sphère de 6 m de rayon sans aucun son : les créatures à l'intérieur sont assourdies et immunisées au tonnerre ; rien de ce qui exige un ordre vocal n'y fonctionne.", "Spiral Defender": "Réaction quand tu es ciblé par une attaque (avant le jet) : des boucliers d'énergie imposent le désavantage à cette attaque.", "Steel Barricade": "Mur d'acier de 15 cm d'épaisseur (10 panneaux de 3 x 3 m) ou 7,5 cm (panneaux de 3 x 6 m). Une créature encerclée fait une sauvegarde de DEX pour s'écarter. Chaque panneau a sa CA et ses PV (p. 262).", "Suggestion": "Une créature visible qui t'entend : sauvegarde de WIS ou elle suit une action raisonnable suggérée en une ou deux phrases (pas d'acte manifestement nuisible). Sans effet si immunisée au charme.", "Superior Aegis": "Une créature consentante touchée obtient la résistance aux dégâts contondants, perforants et tranchants, et +3 à sa sauvegarde contre les tirs en rafale (Burst).", "Survival Suit": "Toi et jusqu'à 8 créatures consentantes respirez dans tout environnement (toxique, sous l'eau, vide), êtes immunisés aux poisons inhalés et gaz nocifs, et sans sauvegarde de CON pour chaleur, froid ou pression extrêmes.", "Tactical Defense Zone": "Toi et les alliés à 9 m avez l'avantage aux sauvegardes contre les pouvoirs esper ; une sauvegarde réussie pour demi-dégâts n'inflige aucun dégât.", "Tactical Support Zone": "Zone centrée sur toi : chaque créature non hostile dedans (toi compris) inflige +1d4 radiants quand elle touche avec une attaque d'arme.", "Telepathic Bond": "Lien télépathique entre jusqu'à 8 créatures consentantes (INT 3+) : elles communiquent sans langue commune, à toute distance dans la galaxie.", "Towering Guardian": "Un gardien (construction de FP 5 max) se forme près d'une masse de métal ou de polymère à portée : ami, il agit à son initiative et obéit à tes ordres vocaux. Si ta concentration se rompt, il devient incontrôlable (p. 268).", "Toxic Burst": "Sphère de gaz toxique de 6 m de rayon (légèrement obscurcie, terrain difficile) : sauvegarde de CON à l'apparition, en y entrant ou en y finissant son tour, 4d10 poison (moitié si réussite). +1d10 par rang au-dessus de 5.", "Tracer Strike": "Ta prochaine attaque d'arme réussie inflige +2d6 radiants ; la cible devient visible, émet une faible lumière sur 1,5 m et ne peut plus devenir camouflée, intangible ou invisible.", "Tracker Drone": "Drone de surveillance lié : action bonus pour le diriger. Affichage sur datapad (désavantage à ta Perception) ou affichage direct (ton action, signal impossible à brouiller : tu perçois par ses capteurs).", "Tractor Beam": "Un drone apparaît à portée : il tire sur une créature à 9 de lui, sauvegarde de DEX ou attirée de 6 m vers le drone. Action bonus à chacun de tes tours : nouveau tir.", "Trauma": "Attaque de forge au corps à corps : 3d10 nécrotiques. +1d10 par rang au-dessus de 1.", "Treacherous Allies": "Une créature visible : sauvegarde d'INT (réussite auto si immunisée à la peur) ou elle voit toutes les créatures comme des ennemis. Nouvelle sauvegarde à la fin de chacun de ses tours.", "Unfetter": "Une créature consentante touchée ignore le terrain difficile ; les pouvoirs ne peuvent ni réduire sa vitesse ni la paralyser ou l'entraver ; 1,5 m de déplacement pour se libérer de liens ou d'une prise ; aucune pénalité sous l'eau.", "Veiled Observer": "Orbe invisible qui te transmet ce qu'il voit (vision normale et dans le noir à 9 m, dans toutes les directions). Action : le déplacer de 9 m ; il ne quitte pas le système stellaire et passe par une ouverture de 2,5 cm.", "Throw": "Attaque de canalisation à distance ; si elle touche, sauvegarde de CON : 6d6 force (moitié si réussite ; avantage si plus grande que Grande). En cas d'échec, au choix : projetée de 4,5 m contre un mur (3d6 contondants à elle et l'objet, à terre), sur une autre créature (sauvegarde de DEX ou 3d6 aux deux et à terre) ou repoussée de 6 m (3d6 et à terre). +1d6 (aux deux dégâts) par rang au-dessus de 4."};
const FR_F = {"Adept:Ability Score Improvement": "+2 à une caractéristique ou +1 à deux (20 maximum), ou un don si le MG utilise la règle optionnelle des dons.", "Adept:Channeling": "Tu connais Psi Blast + des talents primaires (à volonté) et des talents de rang 1+ activés avec tes points de talent (récupérés au repos long ; à 0 point, tu es au bord de l'épuisement). Caractéristique : CHA. DD {DD}, attaque {ATK}.", "Adept:Psychic Paradigm": "Choisis Animota, Battlemind ou Dreamshaper : capacités aux niveaux 1, 6, 14 et 18.", "Adept:Intellect Fortress": "Avantage aux sauvegardes contre les états charmé et effrayé.", "Adept:Psionic Combat": "{LV:3=2,10=3} utilisations par repos long ; tu connais 2 modes au choix (DD {DD}). Improved Psi Blast : quand Psi Blast touche, chaque créature à 3 m de la cible fait une sauvegarde de DEX ou {LV:1=1d10,5=2d10} psychiques. Mind Spike : action, attaque à distance 27 m, {LV:1=2d8,5=4d8,9=6d8} psychiques et sauvegarde de WIS ou vitesse réduite de moitié. Mental Barrier : réaction, aucun dégât d'une attaque psychique, ou résistance à acide, froid, feu, force, foudre ou radiants jusqu'à ton prochain tour.", "Adept:Animota:Minor Telekinetic": "Tu apprends Tricky Fingers (hors total des talents primaires) ; au niveau 8, activable en action bonus.", "Adept:Animota:Transient Repulsion": "Réaction quand une attaque d'arme te vise : désavantage sur l'attaque ; si elle rate, avantage à ta prochaine attaque contre l'attaquant avant la fin de ton prochain tour. Niveau 14 : si l'attaque rate, l'attaquant subit la moitié des dégâts de l'arme utilisée. 1 fois par repos court ou long.", "Adept:Battlemind:Combat Senses": "Les créatures cachées n'ont pas l'avantage contre toi. Niveau 8 : quand tu es surpris, les attaques contre toi ont le désavantage.", "Adept:Battlemind:Empowered Psi Blast": "Psi Blast ajoute ton mod. CHA ({MOD:CHA}) aux dégâts et ignore la résistance et l'immunité aux dégâts psychiques.", "Adept:Battlemind:Psionic Combat: Psychic Crush": "Nouveau mode : une créature visible à 18 m fait une sauvegarde de WIS : 6d8 psychiques (moitié si réussite) ; en cas d'échec, désavantage aux tests d'INT et WIS. À la fin de chacun de ses tours, nouvelle sauvegarde : échec 2d8, réussite fin.", "Adept:Dreamshaper:Expert Telepath": "Télépathie avec toute créature visible à {LV:1=9 m,8=18 m} qui comprend au moins une langue.", "Adept:Dreamshaper:Mind Blank": "Action : tu mets fin à un effet qui te charme ou t'effraie.", "Adept:Dreamshaper:Psionic Combat: Ego Whip": "Nouveau mode : cône de 4,5 m, sauvegarde de WIS, 4d6 psychiques (moitié si réussite) ; en cas d'échec, neutralisé jusqu'à la fin de son prochain tour.", "Engineer:Ability Score Improvement": "+2 à une caractéristique ou +1 à deux (20 maximum), ou un don si le MG utilise la règle optionnelle des dons.", "Engineer:Call Rig": "Réaction : tu sens la direction de ton rig jusqu'à 800 km (distance exacte à 300 m). Action bonus : il apparaît dans ta main ({LV:1=en dépensant un emplacement,5=sans emplacement}). Rig perdu : nouveau en 8 h et 500 cu.", "Engineer:Forging": "Talents primaires (à volonté) et techniques préparées après un repos long : mod. WIS + niveau = {PREP} techniques, de rangs pour lesquels tu as des emplacements (rechargés au repos long). Caractéristique : WIS. DD {DD}, attaque {ATK}. Le rig sert de focaliseur.", "Engineer:Technical Specialty": "Choisis Heavy Arms, Machinist, Medic ou Tinker : capacités aux niveaux 1, 2, 6, 8 et 17, et techniques de spécialité toujours préparées (hors décompte).", "Engineer:Rig Expansion": "{LV:2=1,6=2} utilisation(s) par repos court ou long, effet au choix. Electromagnetic Pulse : action, automates et constructions à 9 m (moins de 3/4 d'abri) font une sauvegarde d'INT (DD {DD}) ou sont neutralisés (pas de réaction, vitesse 0, seulement Esquiver) jusqu'à la fin de ton prochain tour ou jusqu'à subir des dégâts ; les appareils électroniques non portés sont inertes jusqu'à ton prochain tour. + l'effet de ta spécialité.", "Engineer:Mechanical Devastation": "Un automate ou une construction qui rate sa sauvegarde contre ton Electromagnetic Pulse est détruit si son FP est de {LV:5=1/2,8=1,11=2,14=3,17=4} ou moins.", "Engineer:The Jury Rig": "Décris l'aide voulue et lance 1d100 : si le résultat est ≤ {L}, ton rig improvise un effet (choisi par le MG). Réussite : plus d'utilisation pendant 7 jours ; échec : à nouveau après un repos long.", "Engineer:Heavy Arms:Bonus Proficiencies": "Maîtrise des armures lourdes et des armes de guerre.", "Engineer:Heavy Arms:Combat Expertise": "Quand tu fais une attaque d'arme, une attaque supplémentaire en action bonus ; {MAX1:WIS} fois par repos long.", "Engineer:Heavy Arms:Rig Expansion: Targeting Scanner": "Rig Expansion : quand tu rates une attaque, relance-la avec +10 ; tu dois garder le nouveau résultat.", "Engineer:Heavy Arms:Heavy Weapons Expert": "Pour le recul des armes, tu utilises ton mod. WIS au lieu de STR ; +1 à la CA en maniant une arme de corps à corps à deux mains.", "Engineer:Heavy Arms:Charged Attack": "Une fois par tour, une attaque d'arme réussie inflige +1d8 feu (2d8 au niveau 14).", "Engineer:Machinist:Bonus Proficiencies": "Maîtrise des armes de guerre et des boucliers.", "Engineer:Machinist:Coordinated Attack": "Quand tu fais l'action Attaquer, action bonus : ton drone attaque la même cible (bonus d'attaque de forge {ATK}), {LV:1=1d6,6=2d6} radiants + mod. WIS ; {1+WIS} fois par repos long.", "Engineer:Machinist:Rig Expansion: Fire Blossom": "Rig Expansion : action, les créatures choisies à 9 m font une sauvegarde de DEX : 2d10 + {L} feu (moitié si réussite) ; pas de cible derrière un abri total.", "Engineer:Machinist:Synchronized Attack": "Coordinated Attack inflige 2d6 + mod. WIS, et la cible fait une sauvegarde de CON (DD {DD}) ou n'a pas de réaction jusqu'à la fin de son prochain tour.", "Engineer:Machinist:Repulsor": "Action bonus, main libre : attaque de forge à distance sur une cible à 3 m, 1d8 force (2d8 au niveau 14) ; Grande ou moins : sauvegarde de CON ou à terre.", "Engineer:Medic:Bonus Proficiency": "Maîtrise des boucliers.", "Engineer:Medic:Medical Doctor": "Tes techniques de soin de rang 1+ rendent 2 + le rang de la technique PV de plus.", "Engineer:Medic:Rig Expansion: Rejuvenation": "Rig Expansion : action, tu répartis {L*5} PV entre les créatures choisies à 9 m (jusqu'à la moitié de leurs PV max ; pas les automates).", "Engineer:Medic:Healing Savant": "Quand une technique de rang 1+ soigne une autre créature, tu regagnes 2 + le rang de la technique PV.", "Engineer:Medic:Charged Attack": "Une fois par tour, une attaque d'arme réussie inflige +1d8 nécrotiques (2d8 au niveau 14).", "Engineer:Tinker:Bonus Proficiency": "Maîtrise des armures lourdes et des véhicules (planétaires).", "Engineer:Tinker:Amplified Pulse": "Ton Electromagnetic Pulse inflige aussi 2d10 + {L} foudre aux automates et constructions de la zone, sans résistance possible.", "Engineer:Tinker:Gear Enhancement": "1 fois par repos long : une armure non modifiée gagne +1 à la CA, ou une arme simple ou de guerre +1 à l'attaque et aux dégâts, pendant 12 h (fin de repos long ou 1 h ininterrompue avec l'objet).", "Engineer:Tinker:Rig Expansion: Sabotage Equipment": "Rig Expansion : action, une cible visible à 9 m fait une sauvegarde d'INT (DD {DD}) ou subit au choix : désavantage à sa prochaine attaque (arme simple ou de guerre) ; avantage à la prochaine attaque contre elle (si elle porte une protection) ; perte des résistances contondant, perforant, tranchant dues à son équipement.", "Engineer:Tinker:Defense Upgrade": "+1 à la CA en armure intermédiaire ou lourde ; résistance au feu, au froid, à la foudre ou à la force (au choix, changeable à chaque repos long).", "Hunter:Ability Score Improvement": "+2 à une caractéristique ou +1 à deux (20 maximum), ou un don si le MG utilise la règle optionnelle des dons.", "Hunter:Expert Wayfarer": "Tu ignores le terrain difficile, as l'avantage à l'initiative et, à ton premier tour, l'avantage contre les créatures qui n'ont pas encore agi. En voyage : terrain difficile sans ralentissement, groupe impossible à égarer (sauf moyen non ordinaire), toujours vigilant, discrétion à allure normale seul, et tu sais à quel niveau d'un bâtiment tu te trouves.", "Hunter:Know Your Target": "Choisis un type de proie (aberrations, automates, bêtes, bionatants, constructions, empyréens, goliaths, monstruosités, netherants, plantes, primordiaux, ou 2 types d'humanoïdes). Contre elle : avantage pour la pister (Perception, Survie), double maîtrise en Savoir et Xénobiologie pour s'en souvenir, avantage en Tromperie et Intimidation, avantage en Discrétion pour te cacher d'elle.", "Hunter:Fighting Style": "Choisis un style de combat (non cumulable) : Defense (+1 CA en armure), Dueling (+2 dégâts arme à une main seule), Gunnery (recul -1), Point Shooting (pas de désavantage à distance au contact), Sharpshooting ou Two-Weapon Fighting. Note ton choix dans Choix de progression.", "Hunter:Forging": "Techniques connues et emplacements (rechargés au repos long) selon le tableau ; caractéristique : WIS, DD {DD}, attaque {ATK}. Réaction : tu sens ton rig jusqu'à 800 km ; action bonus : il apparaît dans ta main ({LV:2=1 emplacement,5=gratuit}). Rig perdu : nouveau en 8 h et 500 cu.", "Hunter:Hunter's Mark": "Action bonus : une créature visible à 27 m est marquée (concentration, 1 h) : +1d6 dégâts de tes attaques d'arme contre elle (1d8 si c'est ta proie), avantage aux tests de Perception et Survie pour la trouver. Si elle tombe à 0 PV, action bonus à un tour suivant pour marquer une autre cible.", "Hunter:Hunter Archetype": "Choisis Mechinor, Stalker ou Vanguard : capacités aux niveaux 3, 7, 11 et 15.", "Hunter:Objective Scanner": "Dépense un emplacement et 1 min de concentration : tu sais si des créatures de ta proie sont à 16 km, leur nombre, leur direction et leur distance.", "Hunter:Extra Attack": "Tu attaques deux fois quand tu fais l'action Attaquer.", "Hunter:Favored Quarry": "Choisis un type de proie favori : tu gardes à vie les avantages de Know Your Target contre lui, même en changeant de proie, et tu apprends une langue.", "Hunter:Fast Movement": "Sans armure lourde, tu peux Foncer en action bonus.", "Hunter:Hide in Plain Sight": "Si tu te caches sans bouger ce tour, double maîtrise en Discrétion (ou maîtrise si non maîtrisé) ; jusqu'à ton prochain tour, -{L/2} aux tests de Perception pour te repérer. Perdu si tu bouges, tombes, agis ou réagis.", "Hunter:Mechinor:Technical Expertise": "Maîtrise de la compétence Mécanique et des cybersmith's tools.", "Hunter:Mechinor:Hunter's Companion": "Tu construis un drone compagnon avec IA (8 h, 500 cu) : armored, strike, supply, surveillance ou tactical drone (annexe D). Télépathie ; il agit à son initiative, tu décides de ses actions ; seul si tu es neutralisé ou absent. Détruit : reconstruction avec la sauvegarde de son IA (8 h de travail, 250 cu) ; récupérer un ancien compagnon efface l'IA du compagnon actuel.", "Hunter:Mechinor:Tactical Defense": "Tant que ton compagnon te voit, il a l'avantage à toutes ses sauvegardes.", "Hunter:Stalker:Stalker Techniques": "Tu apprends des pouvoirs supplémentaires à certains niveaux (tableau p. 82), comptés comme techniques de Hunter mais hors décompte.", "Hunter:Stalker:Data Scanner": "Action : une créature, construction ou automate à 18 m ; tu apprends ses immunités, résistances et vulnérabilités. {MAX1:WIS} fois par repos long.", "Hunter:Stalker:Tactical Ambush": "À ton premier tour de combat : +3 m de vitesse, et une attaque supplémentaire avec l'action Attaquer ; si elle touche, +{MOD:WIS} dégâts.", "Hunter:Stalker:Unyielding Pursuit": "Escalade et nage à ta vitesse de marche ; distance de saut calculée avec la DEX au lieu de la STR.", "Hunter:Vanguard:Skirmisher": "Au choix : Breacher (+1d8 dégâts une fois par tour contre une créature blessée), Counterreflex (réaction 1 fois par round : attaque la créature qui t'attaque), Gang Buster (une fois par tour, attaque une autre créature à 1,5 m de la cible).", "Hunter:Vanguard:Defensive Tactics": "Au choix : Multiattack Defense (+4 CA contre une créature qui t'a touché, pour le reste du tour), Steel Will (avantage contre la peur) ou Tumbling Motion (attaques d'opportunité contre toi avec désavantage).", "Melder:Ability Score Improvement": "+2 à une caractéristique ou +1 à deux (20 maximum), ou un don si le MG utilise la règle optionnelle des dons.", "Melder:Channeling": "Talents primaires (à volonté) et talents de rang 1+ activés avec tes points de talent (récupérés au repos long). 6 talents au niveau 1, +2 à chaque niveau. Caractéristique : INT, DD {DD}, attaque {ATK}. Certains talents « conventionnels » se lancent sans points en prenant plus de temps.", "Melder:Esper Recovery": "Une fois par jour, à la fin d'un repos court : tu récupères {2+L/2} points de talent.", "Melder:Melder Discipline": "Choisis Celestian, Defender, Metakinetic, Psychogenic ou Protoweaver : capacités aux niveaux 2, 6, 10 et 14.", "Melder:Celestian:Stellar Expertise": "Double maîtrise en Astrophysique et Xénobiologie (si maîtrisées) ; tu peux faire un test d'INT au lieu de DEX pour l'initiative.", "Melder:Celestian:Cosmic Flux": "Quand une attaque de canalisation touche, action bonus : sauvegarde de WIS (DD {DD}) ou +1d6 radiants et désavantage à sa prochaine attaque ou son prochain test. 1 fois par repos court ou long.", "Melder:Celestian:Sudden Shift": "Réaction quand on t'attaque : téléportation jusqu'à 6 m dans un espace visible, l'attaque rate. 1 fois par repos court ou long.", "Melder:Celestian:Focused Phase": "Les dégâts ne peuvent pas rompre ta concentration sur un talent de métaphase.", "Melder:Defender:Combat Reflexes": "Bonus à l'initiative égal à ton mod. INT ({MOD:INT}).", "Melder:Defender:Force Shield": "Réaction quand tu es touché ou rates une sauvegarde : +1d6 à ta CA contre cette attaque ou à ce jet. {MAX1:INT} fois par repos long.", "Melder:Defender:Focused Targeting": "Avec un talent d'acide, froid, feu, force ou foudre, dépense 3 points : avantage à ton attaque de canalisation, ou désavantage pour une cible à sa première sauvegarde.", "Melder:Defender:Extended Shield": "Réaction : accorde ton Force Shield à une créature visible à 18 m touchée ou qui rate une sauvegarde (dépense une utilisation).", "Melder:Metakinetic:Talent Accuracy": "Avec un talent élémentaire ou de kinésie, choisis 1 + rang du talent créatures visibles : elles réussissent automatiquement leur sauvegarde et ne subissent aucun dégât.", "Melder:Metakinetic:Prime Booster": "Une créature qui réussit sa sauvegarde contre ton talent primaire subit quand même la moitié des dégâts (sans autre effet).", "Melder:Metakinetic:Empowered Metakinetic": "Ajoute ton mod. INT ({MOD:INT}) à un jet de dégâts de tes talents élémentaires ou de kinésie.", "Melder:Protoweaver:Studied Savant": "Double maîtrise en Astrophysique, Savoir et Xénobiologie (si maîtrisées) ; double maîtrise en Investigation pour exploiter archives et données scientifiques.", "Melder:Protoweaver:Elemental Alterist": "En activant un talent d'acide, froid, feu, foudre ou tonnerre, dépense 2 points de plus pour changer son type parmi cette liste ; jusqu'à la fin de ton prochain tour, +2 aux sauvegardes contre ce nouveau type.", "Melder:Protoweaver:Talent Splicer": "En activant un talent, action bonus + 4 points : portée doublée (1,6 km max), ou +1d4 au DD, ou +{L/2} dégâts.", "Melder:Protoweaver:Dynamic Focus": "Tu peux utiliser l'INT au lieu de la CON pour tes sauvegardes de concentration.", "Melder:Psychogenic:Mesmerize": "Action : une cible à 1,5 m qui te voit et t'entend fait une sauvegarde de WIS (DD {DD}) ou ne peut plus bouger, hébétée et neutralisée jusqu'à la fin de ton prochain tour (maintien : ton action à chaque tour). Fin si elle subit des dégâts ou s'éloigne à plus de 3 m ; ensuite, plus sur elle avant un repos long.", "Melder:Psychogenic:Daze and Disorient": "Action : une cible visible à 9 m fait une sauvegarde de WIS (DD {DD}) ou n'a plus de réaction jusqu'à la fin de ton prochain tour, et désavantage à sa prochaine attaque. Réussite : immunisée jusqu'à ton repos long.", "Melder:Psychogenic:Secondary Mind": "Un pouvoir psychogénique de rang 1+ à cible unique peut viser une seconde cible.", "Sentinel:Ability Score Improvement": "+2 à une caractéristique ou +1 à deux (20 maximum), ou un don si le MG utilise la règle optionnelle des dons.", "Sentinel:Sentinel's Rig": "Ton rig est intégré à ton corps (harnais), impossible à retirer. Action bonus ({LV:1=+ 1 emplacement,5=sans emplacement}) : le rendre invisible aux sens ordinaires pendant {L} h ou jusqu'à rupture de concentration.", "Sentinel:Regenerative Force": "Réserve de {L*5} PV (rechargée au repos long). Action, au toucher : rends des PV pris dans la réserve, ou dépense 5 PV pour guérir une maladie ou neutraliser un poison. Sans effet sur automates et constructions.", "Sentinel:Weapon Link": "Lien avec une arme de corps à corps (1 h, possible pendant un repos court) : action bonus pour l'appeler dans ta main ; impossible de te désarmer sauf si neutralisé. Renvoyée dans le rig au-delà de 3 m. 2 liens max, un seul en main.", "Sentinel:Fighting Style": "Choisis un style (non cumulable) : Defense (+1 CA en armure), Dueling (+2 dégâts arme à une main seule), Great Weapon Fighting (relance les 1 et 2 à deux mains), Protection (réaction : désavantage à une attaque contre un allié à 1,5 m, bouclier requis), Range Deterrence (réaction : attaque d'opportunité contre un tireur à 1,5 m), Zone Defender (posture : attaques d'opportunité sans réaction).", "Sentinel:Forging": "Techniques préparées après un repos long : mod. CHA + moitié du niveau = {PREP}, de rangs pour lesquels tu as des emplacements (rechargés au repos long). Caractéristique : CHA, DD {DD}, attaque {ATK}.", "Sentinel:Infused Strike": "Melee Strike : quand ton arme liée touche au corps à corps, dépense un emplacement : +2d8 radiants (

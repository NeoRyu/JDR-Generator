ns et netherants). Échec selon les PV actuels : 50 ou moins = assourdie 1 min ; 40 ou moins = assourdie et aveuglée 10 min ; 30 ou moins = aveuglée, assourdie et étourdie 1 h ; 20 ou moins = tuée. Sans effet sur automates et constructions.", "Antipathy/Sympathy": "Une cible (objet, créature Très Grande max ou zone de 60 m) repousse ou attire un type de créature intelligente désigné pendant 10 jours. Antipathie : sauvegarde de WIS ou effrayée à vue ou à 18 m, elle doit fuir. Sympathie : elle est irrésistiblement attirée. Pas sur automates et constructions.", "Baneful Trigger": "Piège presque invisible (Investigation contre ton DD) sur une surface ou dans un objet, conditions au choix. Déclenché : sphère de 18 m de rayon pendant 10 min. Effet au choix : Mort (sauvegarde de CON, 10d10 nécrotiques, moitié si réussite), Discorde (CON), Peur (WIS), Désespoir (CHA), Folie (INT)…", "Blade Barrier": "Mur de lames (30 m x 6 m x 1,5 m, ou anneau de 18 m de diamètre) : abri aux trois quarts, terrain difficile. Y entrer ou y commencer son tour : sauvegarde de DEX, 6d10 tranchants (moitié si réussite).", "Cellular Renewal": "Une créature visible regagne 70 PV ; fin de la cécité, de la surdité et des maladies (pas les automates). +10 PV par rang au-dessus de 6.", "Chain Lightning": "Éclair sur une cible visible, puis 3 éclairs vers 3 autres cibles à 9 m de la première : sauvegarde de DEX, 10d8 foudre chacune (moitié si réussite). +1 éclair par rang au-dessus de 6.", "Clone Cast": "Copie illusoire intangible de toi, n'importe où à portée (2 400 km) dans un lieu déjà vu. Action : la déplacer et la faire agir ; tu vois et entends par elle (action bonus pour basculer, tu es alors aveuglé et assourdi chez toi). Disparaît si elle subit des dégâts.", "Control Gravity": "Cylindre de 15 m de rayon et 30 m de haut, effet au choix : gravité accrue (poids doublé, terrain difficile, désavantage aux sauts et escalades, volants : sauvegarde de STR ou chute), gravité inversée (tout tombe vers le haut, sauvegarde de DEX pour s'accrocher) ou apesanteur.", "Cosmic Prison": "Une créature visible : sauvegarde de WIS ou emprisonnée (réussite = immunisée à ce pouvoir) ; plus besoin de respirer, manger ni vieillir, indétectable par clairsentience. Forme au choix : tombeau de force sous terre, prison dimensionnelle, contenue dans un petit objet, liens de sorium (entravée)…", "Cosmic Weave": "Le pouvoir ultime : reproduit n'importe quel pouvoir de rang 8 ou moins sans condition, ou crée un effet majeur (objet jusqu'à 250 000 cu, soin complet de 20 créatures, résistance, etc. ; liste p. 224). Usage hors liste : risques et contrecoups au choix du MG.", "Crushing Vortex": "Une petite sphère sombre apparaît à portée ; quand la concentration prend fin, elle explose (sphère de 6 m de rayon) : sauvegarde de DEX, dégâts de force cumulés (12d6 de base, +1d6 à chaque fin de ton tour sans explosion), moitié si réussite.", "Dark Vortex": "Explosion de matière noire (sphère de 18 m de rayon) : sauvegarde de CON (désavantage pour protéens et plantes), 12d6 nécrotiques et aveuglée et assourdie 1 min (moitié sans effet si réussite) ; nouvelle sauvegarde à la fin de chacun de ses tours. Éteint les lumières.", "Devastation": "Un globe d'antimatière dans une créature visible : sauvegarde de CON, 7d8 + 30 nécrotiques (moitié si réussite).", "Directed Strike": "Lien tactique de 9 m de rayon : à l'activation et en action bonus, un allié visible qui te voit fait une attaque d'arme avec sa réaction contre une cible dans la zone. +1 allié et +3 m de rayon par rang au-dessus de 6.", "Disintegrate": "Rayon sur une cible (créature, objet ou création de pouvoir comme un Force Field) : sauvegarde de DEX ou 10d6 + 40 force ; réduite à 0 PV, elle est désintégrée (seuls le sorium et l'équipement amélioré restent). Objet ou création de pouvoir de taille Grande ou moins : désintégré automatiquement ; Très Grand ou plus : une portion d'un cube de 3 m. Objets en sorium ou améliorés épargnés.", "Dismantle": "Un automate, une construction ou un appareil visible : sauvegarde de CON, 6d8 force + 6d8 foudre et paralysé (moitié et neutralisé si réussite). Au début de chacun de ses tours, nouvelle sauvegarde : échec 1d8 force, réussite = fin.", "Dynamic Passage": "Lien entre un grand appareil à portée et un autre appareil déjà vu ou touché dans le même système stellaire (1,8 m min) : pendant 1 round, toute créature entre dans l'un et ressort de l'autre en 1,5 m de déplacement.", "Elemental Vortex": "Tourbillon élémentaire de 12 m de rayon : sauvegarde de DEX, 10d6 d'un type tiré au d6 pour chaque créature (acide, froid, feu, foudre, poison, tonnerre ; moitié si réussite) ; en cas d'échec, sauvegarde de STR ou entravée jusqu'à la fin de son prochain tour.", "Elite Construct": "Tu forges un protecteur d'élite (prime-alpha mecharoid, statistiques chez le MG) sous ton contrôle 24 h : action bonus pour le commander à 18 m ; sans ordre, il se défend.", "Enduring Design": "Un automate, une construction ou un véhicule touché devient immunisé aux intempéries, ignore le terrain difficile, ne peut être étourdi ni neutralisé, et regagne le maximum de PV, PC ou IS lors d'un repos court ou d'une réparation.", "False Fact": "Pendant 1 h, tu peux remplacer le dé de tes tests de CHA par un 15, et tout moyen de détecter le mensonge (technologie, capacité, pouvoir) indique que tu dis la vérité.", "Fire Storm": "Jusqu'à dix cubes de 3 m contigus à portée : sauvegarde de DEX, 7d10 feu (moitié si réussite) ; enflamme les objets non portés.", "Force Prison": "Cube de force invisible de 3 m : bloque toute matière et les pouvoirs ; les créatures entièrement dedans sont piégées, les autres repoussées. Impossible d'en sortir par des moyens ordinaires (téléportation : sauvegarde de CHA). Dure 1 h.", "Foresight": "Une créature consentante touchée ne peut être surprise et a l'avantage aux attaques, tests et sauvegardes ; les attaques contre elle ont le désavantage, pendant 8 h.", "Forge Automaton": "Avec jusqu'à 3 constructions désactivées ou 0,8 m² de ferraille, tu forges jusqu'à 3 alphalites sous ton contrôle (statistiques chez le MG) : action bonus pour les commander à 36 m.", "Frost Zone": "Explosion de froid (sphère de 18 m de rayon) : sauvegarde de CON, 10d6 froid (moitié si réussite) ; gèle les liquides sur 15 cm d'épaisseur (zone de 9 m) pendant 1 min, piégeant les nageurs.", "Full Reconstruction": "Restaure une machine, construction, véhicule ou appareil détruit depuis moins d'un siècle (aux 3/4 complet) dans son état optimal, avec tous ses PV (ou IS pour un vaisseau standard, sans le carburant). Pas les vaisseaux de grande échelle.", "Full Restore": "Ramène à la vie une créature morte depuis 300 ans max (pas de vieillesse, pas d'automate) avec tous ses PV : poisons, maladies et effets néfastes supprimés, membres restaurés ; nouveau corps possible avec ses données physiques.", "Full Revive": "Ramène à la vie une créature morte depuis un siècle max (pas de vieillesse, pas d'automate) avec tous ses PV, membres restaurés ; les afflictions de pouvoirs persistent. Retour éprouvant : -4 aux jets, réduit à chaque repos long.", "Full Transmute": "Transforme une créature en autre créature, une créature en objet ou un objet en créature (sauvegarde de WIS si non consentante). Dure jusqu'à 1 h, ou permanent si tu te concentres toute la durée. Sans effet sur un métamorphe ou une créature à 0 PV.", "Fusion Beam": "Rayon solaire de 18 m x 1,5 m : sauvegarde de CON (désavantage pour netherants et plantes), 6d8 radiants et aveuglée jusqu'à ton prochain tour (moitié sans cécité si réussite). Ton action à chaque tour : nouveau rayon. Ta main émet une lumière vive sur 9 m.", "Illusory Trigger": "Illusion invisible (cube de 9 m max, sons compris, jusqu'à 5 min de scénario) qui se déclenche sur une condition choisie, puis redevient dormante 10 min avant de pouvoir se rejouer.", "Intangible Form": "Tu deviens éthéré jusqu'à 8 h : déplacement dans toutes les directions (monter ou descendre coûte double), tu vois le monde en gris jusqu'à 18 m et n'interagis qu'avec ce qui est dans le même état.", "Mass Renewal": "Tu répartis jusqu'à 700 PV entre les créatures visibles à portée, et guéris leurs maladies, cécités et surdités (pas les automates).", "Mass Suggestion": "Jusqu'à 12 créatures visibles qui te comprennent : sauvegarde de WIS ou elles suivent une action raisonnable suggérée (24 h). Sans effet si immunisées au charme. Rang supérieur : durée plus longue (p. 244).", "Mind Blank": "Une créature consentante touchée est immunisée pendant 24 h aux dégâts psychiques, à la lecture des émotions et des pensées, aux pouvoirs de clairsentience et à l'état charmé (même contre Cosmic Weave).", "Mind Fracture": "Une créature visible subit 4d6 psychiques et fait une sauvegarde d'INT ; échec : INT et CHA tombent à 1, plus de pouvoirs, de machines, de langage (elle reconnaît encore ses amis). Nouvelle sauvegarde tous les 30 jours ; fin aussi par Cosmic Weave, Full Restore…", "Motor Dysfunction": "Une créature visible (sauf immunisée au charme) titube sur place : tout son déplacement est perdu, désavantage aux sauvegardes de DEX et aux attaques, avantage aux attaques contre elle. Action : sauvegarde de WIS pour se reprendre.", "Negation Field": "Barrière de 3 m de rayon autour de toi : aucun pouvoir de rang 5 ou moins lancé de l'extérieur ne peut affecter ce qui est à l'intérieur. +1 rang bloqué par rang au-dessus de 6.", "Phantom Zone": "Porte d'ombre sur une surface vers une salle extradimensionnelle de 18 m de côté (nouvelle ou déjà créée). À la fin de l'effet (1 h), la porte disparaît et ce qui est à l'intérieur y reste piégé.", "Phase Walk": "Deux portails de 3 m de diamètre liés, un à 3 m de toi et un autre jusqu'à 150 m : toute créature qui entre dans l'un ressort par l'autre, pendant 10 min.", "Psychic Overload": "Une créature visible ayant 150 PV ou moins est étourdie ; sauvegarde de CON à la fin de chacun de ses tours pour mettre fin à l'effet.", "Psychic Storm": "Jusqu'à 8 créatures visibles : sauvegarde d'INT, 12d8 psychiques et étourdies (moitié sans étourdissement si réussite) ; nouvelle sauvegarde d'INT à la fin de chacun de leurs tours.", "Reactive Aura": "Sphère de 9 m autour de toi : les créatures choisies ont l'avantage à toutes les sauvegardes ; la première fois que l'une est touchée par une arme ou un pouvoir, l'attaquant fait une sauvegarde de DEX, 6d10 radiants (moitié si réussite).", "Reave": "Une cible à portée : sauvegarde de CON, 7d8 + 30 nécrotiques (moitié si réussite) ; tuée, elle est dispersée (seuls les objets améliorés restent), ramenable seulement par Full Restore ou Cosmic Weave.", "Regenerate": "La créature touchée regagne 4d8 + 15 PV, puis 1 PV au début de chacun de ses tours pendant 1 h ; ses membres coupés repoussent en 2 min (ou se ressoudent aussitôt).", "Return Point": "Toi et jusqu'à 5 créatures consentantes à 1,5 m êtes téléportés à ton refuge désigné (lieu familier, préparé en lançant ce pouvoir sur place ; pas sur un vaisseau en mouvement).", "Rift Blade": "Une lame spectrale : attaque de canalisation à distance (ignore les abris partiels), 3d10 force ; action bonus à chacun de tes tours pour attaquer de nouveau.", "Secure Structure": "Protège jusqu'à 230 m² (6 m de haut) pendant 24 h, avec exceptions et mot de passe : portes verrouillées (comme Magnetic Seal, jusqu'à 10 camouflées en mur), terminaux brouillés (sauvegarde d'INT pour s'en servir), passages très obscurcis (50 % de chances de se tromper de direction à chaque embranchement), escaliers en terrain difficile avec sauvegarde de WIS, et autres effets du livre (p. 258).", "Shapeshift": "Tu prends la forme d'une créature déjà vue de FP ≤ ton niveau (pas automate, construction ni netherant) : ses statistiques remplacent les tiennes sauf INT, WIS, CHA et tes maîtrises. Action pour changer de forme.", "Shattersense": "Une créature visible à 18 m : sauvegarde de WIS ou effet au choix pendant la durée : Peur (effrayée, elle fuit par l'action Foncer), Malaise (désavantage aux attaques et tests ; nouvelle sauvegarde à chaque fin de tour) ou Sommeil (inconsciente jusqu'à des dégâts ou être secouée). Ton action à chaque tour : cibler une autre créature (pas une qui a réussi).", "Space Fold": "Téléporte toi et jusqu'à 8 créatures consentantes (ou un objet de 3 m) vers une destination connue sur le même corps planétaire ou en orbite ; risque d'erreur selon ta connaissance du lieu.", "Space Walk": "Toi et jusqu'à 10 créatures consentantes survivez dans le vide : pas besoin de respirer, vol 90 m, immunité feu, froid, nécrotique et radiant ordinaires. Seulement Foncer, Esquiver, Se désengager ; pas de parole.", "Stim Patch": "Toi et jusqu'à 12 créatures : après 1 h, guéris des maladies et poisons, immunisés au poison et à la peur, avantage aux sauvegardes de WIS, PV max et actuels +2d10, pendant 24 h.", "Superior Domination": "Une créature visible : sauvegarde de WIS (avantage si vous la combattez) ou charmée 1 h. Lien télépathique : ordres sans action ; ton action pour un contrôle total jusqu'à la fin de ton prochain tour. Nouvelle sauvegarde à chaque dégât.", "Superior Negation Field": "Sphère de 3 m qui te suit : aucun pouvoir ne peut y être activé, les créatures invoquées disparaissent et l'équipement amélioré devient ordinaire ; les effets esper y sont suspendus.", "Telepathy": "Lien télépathique avec une créature consentante familière, à travers la galaxie, pendant 1 h : vous échangez mots, images, sons et sensations.", "Temporal Divergence": "Une créature consentante ou un objet touché sort du flux du temps : invisible à toute détection, en animation suspendue, intangible, jusqu'à dissipation ou une condition que tu fixes.", "Temporal Stasis": "Le temps s'arrête pour tous sauf toi : tu joues 1d4 + 1 tours d'affilée. Fin si tu affectes une autre créature ou un objet qu'elle porte, ou si tu t'éloignes de plus de 300 m.", "Terminate Function": "Une créature visible ayant 100 PV ou moins meurt instantanément.", "Truesight": "Une créature consentante touchée a la vision véritable à 36 m pendant 1 h : portes cachées par des pouvoirs, poches dimensionnelles et distorsions spatiales comprises.", "Unbreakable Armor": "Une armure translucide t'entoure (faible lumière sur 1,5 m) : immunité à tous les dégâts pendant la durée.", "Virtual Navigator": "Affichage visible de toi seul : le chemin le plus direct vers un lieu fixe familier du même système stellaire, avec distance et direction, pendant 24 h.", "Virus": "Une créature visible : sauvegarde de CON, 14d6 nécrotiques (moitié si réussite ; ne la descend pas sous 1 PV). En cas d'échec, PV max réduits d'autant pendant 1 h. Sans effet sur automates et constructions.", "Warded Refuge": "Zone protégée (3 700 m², 9 m de haut) pendant 1 min : téléportation, portails et voyages extradimensionnels bloqués ; les types choisis (automates, constructions, netherants, primordiaux, protéens) subissent des dégâts en y entrant (p. 270).", "Warp Sphere": "Distorsion spatiale (sphère de 18 m de rayon) : sauvegarde de CON, 8d6 force (moitié si réussite). +2d6 par rang au-dessus de 6.", "Warp Storm": "Quatre explosions de vide spatial (sphères de 12 m de rayon) jusqu'à 1,5 km : sauvegarde de DEX, 20d6 force + 20d6 froid (moitié si réussite) ; une seule fois par créature ; endommage les structures.", "Writhing Storm": "Masse électrique de 6 m de rayon (très obscurcie) : à l'apparition, en y entrant ou en y finissant son tour, sauvegarde de DEX, 10d8 foudre (moitié si réussite). Elle s'éloigne de toi de 3 m à chacun de tes tours.", "Zone of Terror": "Sphère de 9 m de rayon : sauvegarde de WIS ou effrayée ; à la fin de chacun de ses tours, sauvegarde de WIS : échec 4d10 psychiques, réussite = fin."}, "fh": {"Adept:Esper Mastery": "Tu choisis un talent de rang 6 de la liste de l'Adept (puis un de rang 7 au niv. 13, 8 au niv. 15, 9 au niv. 17). Chacun s'active une fois en payant ses points de talent, puis repos long.", "Adept:Psionic Recovery": "À la fin d'un repos court, tu récupères une utilisation de Psionic Combat (une fois par repos long).", "Adept:Psychic Paradigm feature": "Nouvelle capacité de ton paradigme : voir la section du paradigme.", "Adept:Animota:Volitation": "Action bonus : tu voles à ta vitesse jusqu'à ce que tu y mettes fin (action bonus). Impossible lourdement chargé ou en armure intermédiaire ou lourde.", "Adept:Animota:Opposing Force": "Champ de répulsion permanent (activable ou désactivable sans action) : résistance aux dégâts contondants, perforants et tranchants des armes ordinaires.", "Adept:Battlemind:Psychic Recoil": "Réaction quand une attaque au corps à corps te touche : l'attaquant subit {L} psychiques et fait une sauvegarde de CON (DD {DD}) ou est repoussé de 3 m et à terre.", "Adept:Battlemind:Tracing the Curve": "Tes attaques de canalisation à distance et ton Psionic Combat ignorent les abris partiels et aux trois quarts ; une créature qui passe à l'abri total reste ciblable jusqu'à la fin de ton prochain tour.", "Adept:Dreamshaper:Thought Shield": "Tes pensées ne peuvent être lues sans ton accord ; résistance aux dégâts psychiques, et une créature qui t'en inflige subit les mêmes dégâts.", "Adept:Dreamshaper:Aura of Dominance": "Les créatures que tu charmes avec un pouvoir ne se rendent jamais compte qu'elles l'ont été.", "Cybermancer:Esper Mastery": "Tu choisis un talent de rang 6 de la liste du Cybermancer (puis un de rang 7 au niv. 13, 8 au niv. 15, 9 au niv. 17). Chacun s'active une fois sans emplacement, puis repos long.", "Cybermancer:Master Cipher": "1 minute de concentration : tu récupères tous tes emplacements de talent. Une fois par repos long.", "Engineer:Technical Specialty feature": "Nouvelle capacité de ta spécialité : voir la section de la spécialité.", "Engineer:Rig Expansion (3/rest)": "Rig Expansion : 3 utilisations entre deux repos.", "Engineer:The Jury Rig (improvement)": "The Jury Rig réussit automatiquement, sans jet.", "Engineer:Heavy Arms:Dreadnought": "En armure intermédiaire ou lourde : résistance aux dégâts de feu, contondants, perforants et tranchants.", "Engineer:Machinist:Jetpack": "Ton rig devient un module : vitesse de vol et de nage égales à ta vitesse de marche (pas de vol sous un plafond de moins de 4,5 m).", "Engineer:Medic:Master Medic": "Quand un pouvoir te fait lancer des dés pour rendre des PV, utilise le maximum de chaque dé.", "Engineer:Tinker:Expert Saboteur": "Sabotage Equipment peut viser jusqu'à 5 créatures à 9 m, avec le même effet.", "Hunter:Hunter Archetype feature": "Nouvelle capacité de ton archétype : voir la section de l'archétype.", "Hunter:Vanish": "Se cacher en action bonus ; impossible de te pister par des moyens ordinaires, physiques ou numériques, sauf si tu le veux.", "Hunter:Blind Fighting": "Pas de désavantage pour attaquer une créature que tu ne vois pas ; tu connais la position des créatures invisibles non cachées à 9 m (si tu n'es ni aveuglé ni assourdi).", "Hunter:Slayer": "Une fois par tour, ajoute ton mod. WIS ({MOD:WIS}) au jet d'attaque ou de dégâts contre ta proie (favorite ou choisie), avant ou après le jet.", "Hunter:Mechinor:Multitargeting": "Ton compagnon peut, avec son action, attaquer au corps à corps chaque créature de son choix à portée (un jet par cible).", "Hunter:Mechinor:Reactive Dodge": "Réaction de ton compagnon quand un attaquant qu'il voit le touche : il divise les dégâts par deux.", "Hunter:Stalker:Barrage Assault": "Une fois par tour, quand tu rates une attaque d'arme, tu fais une autre attaque d'arme dans la même action.", "Hunter:Stalker:Stalker's Defense": "Réaction quand un attaquant visible te touche : tu divises les dégâts par deux.", "Hunter:Vanguard:Multiattack": "Au choix : Rapid Fire (action : attaque à distance contre chaque créature à 3 m d'un point visible, munitions requises) ou Whirlwind Attack (action : attaque au corps à corps contre chaque créature à 1,5 m).", "Hunter:Vanguard:Superior Defender": "Au choix : Evasion (sauvegarde de DEX pour demi-dégâts : aucun en cas de réussite, moitié en cas d'échec) ou Rushing Diversion (réaction : la créature qui te rate au corps à corps refait l'attaque contre une autre créature de ton choix).", "Melder:Esper Mastery": "Tu choisis un talent de rang 6 de la liste du Melder (puis un de rang 7 au niv. 13, 8 au niv. 15, 9 au niv. 17). Chacun s'active une fois en payant ses points de talent, puis repos long. À chaque niveau, tu peux en échanger un contre un autre du même rang.", "Melder:Melder Discipline feature": "Nouvelle capacité de ta discipline : voir la section de la discipline.", "Melder:Prime Channeling": "Choisis un talent de rang 1 et un de rang 2 connus : tu les utilises à leur rang minimal sans dépenser de points (à volonté). 8 h de méditation pour les échanger.", "Melder:Signature Talents": "Choisis deux talents de rang 3 connus : chacun s'active une fois au rang 3 sans points, puis repos court ou long.", "Melder:Celestian:Cosmic Ward": "Résistance au feu et aux radiants ; une créature qui te touche avec des dégâts radiants subit {L/2} radiants.", "Melder:Defender:Reactive Shield": "Après un Force Shield, jusqu'à la fin de ton prochain tour, chaque attaquant qui touche la cible protégée subit {L/2} force.", "Melder:Metakinetic:Overchannel": "Un talent de rang 1 à 5 qui inflige des dégâts fait ses dégâts maximum. Gratuit la première fois ; ensuite avant un repos long, tu subis 2d12 nécrotiques par rang (+1d12 par rang à chaque nouvelle utilisation), sans résistance possible.", "Melder:Psychogenic:Memory Sculpting": "Quand tu charmes avec un talent psychogénique, une créature oublie l'avoir été ; une fois avant la fin, ton action peut effacer davantage de souvenirs de cette période (sauvegarde d'INT, DD {DD}).", "Melder:Protoweaver:Prime Resilience": "Résistance aux dégâts des talents et techniques, et avantage aux sauvegardes contre eux.", "Sentinel:Amplified Strike": "Les coups de ton arme liée infligent +1d8 radiants (cumulable avec Infused Strike).", "Sentinel:Pattern Absorption": "Action : mets fin à un pouvoir esper sur toi ou une créature consentante touchée. {MAX1:CHA} fois par repos long.", "Sentinel:Sentinel's Path feature": "Nouvelle capacité de ta voie : voir la section de la voie.", "Sentinel:Tactical Display improvements": "La portée de Multi-User Tactical Display, Expanded Tactical Display et des auras de ta voie passe de 3 m à 9 m.", "Sentinel:Path of the Champion:Celestial Renewal": "Quand tu tombes à 0 PV sans être tué, tu restes à 1 PV. Une fois par repos long.", "Sentinel:Path of the Champion:Corona": "Action : aura solaire 1 min (lumière vive 9 m) ; un ennemi qui y commence son tour subit 10 radiants ; avantage aux sauvegardes contre les pouvoirs des protéens et netherants. Une fois par repos long.", "Sentinel:Path of the Slayer:Counterbrand": "Réaction quand la cible de ton Slayer's Mark attaque : tu fais une attaque d'arme contre elle si elle est à portée.", "Sentinel:Path of the Slayer:Solar Avenger": "Action, pendant 1 min : résistance à tous les dégâts, vitesse + 5 x mod. CHA en pieds, une attaque supplémentaire avec l'action Attaquer.", "Specialist:Reliable Talent": "Pour tout test qui ajoute ton bonus de maîtrise, un 9 ou moins au d20 compte comme un 10.", "Specialist:Specialist Archetype feature": "Nouvelle capacité de ton archétype : voir la section de l'archétype.", "Specialist:Blindsense": "Si tu entends, tu connais la position des créatures cachées ou invisibles à 3 m.", "Specialist:Slippery Mind": "Maîtrise des sauvegardes de WIS.", "Specialist:Elusive": "Aucune attaque n'a l'avantage contre toi tant que tu n'es pas neutralisé.", "Specialist:Stroke of Luck": "Une attaque ratée devient un coup réussi, ou un test raté compte comme un 20 au d20. Une fois par repos court ou long.", "Specialist:Infiltrator:Electronics Expert": "Avantage aux tests d'INT (Informatique) pour identifier et utiliser consoles et appareils de données ; tu ignores les barrières de "Virtual Display": "Tu vois le contenu d'un \u00e9cran num\u00e9rique visible \u00e0 port\u00e9e, en image translucide visible de toi seul, tant qu'il reste \u00e0 port\u00e9e.",
"Friends": "Avantage \u00e0 tous les tests de CHA envers une cr\u00e9ature non hostile ; \u00e0 la fin, elle comprend qu'elle a \u00e9t\u00e9 influenc\u00e9e et devient hostile (vengeance possible selon le MJ).",
"Intercept Directive": "Tu lis les ordres \u00e9lectroniques des automates et constructions : avantage aux sauvegardes de DEX et de WIS contre leurs attaques pendant la dur\u00e9e.",
"Barrier": "Un champ de force entoure une cr\u00e9ature choisie \u00e0 port\u00e9e : +2 \u00e0 sa CA pendant la dur\u00e9e.",
"Bonded Companion": "Avec 100 cu de sorium, cr\u00e9e un compagnon semi-intelligent (forme animale, statistiques en annexe B) : initiative propre, ob\u00e9it mais n'attaque pas ; t\u00e9l\u00e9pathie \u00e0 30 m ; action pour voir et entendre par lui ; renvoi temporaire ou d\u00e9finitif. Un seul \u00e0 la fois.",
"Dark Circle": "Anneau de disruption \u00e0 3 m autour de toi : sauvegarde de STR, {0} n\u00e9crotiques et plus de r\u00e9actions jusqu'\u00e0 son prochain tour ; moiti\u00e9 des d\u00e9g\u00e2ts seulement si r\u00e9ussite. +1d6 par rang au-dessus de 1.",
"Deflect Elements": "Un g\u00e9n\u00e9rateur de champ sur une cr\u00e9ature consentante : +2 \u00e0 sa prochaine sauvegarde contre des d\u00e9g\u00e2ts \u00e9l\u00e9mentaires (feu, froid, foudre, tonnerre), puis l'effet cesse.",
"Extended Incline": "Une cr\u00e9ature consentante touch\u00e9e se d\u00e9place sur les murs et au plafond, mains libres, avec une vitesse d'escalade \u00e9gale \u00e0 sa vitesse.",
"Mass Alteration": "Nouvelle apparence illusoire pour toutes les cr\u00e9atures choisies visibles (CHA si non consentantes) : v\u00eatements et \u00e9quipement compris, \u00b130 cm, m\u00eame morphologie. Un examen physique ou un test d'INT (Investigation) peut la d\u00e9jouer.",
"Mechanical Stasis": "Un automate ou une construction visible : sauvegarde de WIS ou paralys\u00e9 ; nouvelle sauvegarde \u00e0 la fin de chacun de ses tours. +1 cible (\u00e0 9 m) par rang au-dessus de 5.",
"Trigger Device": "Alimente ou d\u00e9clenche \u00e0 distance un appareil simple (cube de 1,5 m max, un interrupteur ou un contact : \u00e9clairage, ventilateur, \u00e9cran, porte). Sans source d'\u00e9nergie, tu l'alimentes 1 min. Pas d'objet en mouvement ni port\u00e9.",
"Spoof Command": "Tu trompes le protocole de s\u00e9curit\u00e9 de {0} (INT 3+) : sauvegarde d'INT (avantage si vous le combattez) ou il te consid\u00e8re comme un ami ; fin si vous l'attaquez, et il sait ensuite qu'il a \u00e9t\u00e9 tromp\u00e9.",
"Stasis Field": "{0} : sauvegarde de WIS ou paralys\u00e9(s) ; nouvelle sauvegarde \u00e0 la fin de chacun de ses tours. Cibles suppl\u00e9mentaires \u00e0 9 m les unes des autres.",
"Stealth Sentry": "Micro-drone invisible pendant la dur\u00e9e : un ennemi qui arrive \u00e0 3 m de lui pour la premi\u00e8re fois du tour fait une sauvegarde de DEX, 20 radiants (moiti\u00e9 si r\u00e9ussite). Se d\u00e9sint\u00e8gre apr\u00e8s 60 d\u00e9g\u00e2ts inflig\u00e9s ; neutralis\u00e9 par Unravel Effect ou 30 d\u00e9g\u00e2ts d'un pouvoir de rang 4+.",
"Capacitor": "Sph\u00e8re de 18 m de lumi\u00e8re vive (et 18 m de faible), sur un point ou un objet qu'elle suit ; la couvrir bloque la lumi\u00e8re. Dissipe les t\u00e9n\u00e8bres d'un pouvoir de rang \u2264 3 qui la chevauche.",
"Fire Lance": "Rayon de flammes qui explose \u00e0 l'impact : attaque de pouvoir \u00e0 distance, {0} feu, puis sauvegarde de CON ou d\u00e9savantage \u00e0 son prochain jet d'attaque ou de sauvegarde. +1d8 par rang au-dessus de 1.",
"Obfuscate": "{0} touch\u00e9e(s) devien(nen)t invisible(s) avec ce qu'elle porte ; l'effet cesse pour une cible qui attaque ou utilise un pouvoir.",
"Temporal Fault": "Jusqu'\u00e0 6 cr\u00e9atures dans un cube de 12 m : sauvegarde de WIS ou ralenties (vitesse /2, -2 CA et sauvegardes de DEX dont rafale, pas de r\u00e9action, action ou action bonus, une seule attaque ; pouvoir d'une action retard\u00e9 sur 11+ au d20). Nouvelle sauvegarde \u00e0 chaque fin de tour.",
"Eclipse": "Sph\u00e8re de t\u00e9n\u00e8bres de 4,5 m de rayon qui contourne les angles : bloque toute lumi\u00e8re, m\u00eame la vision dans le noir et les sources ordinaires. Peut \u00e9maner d'un objet qu'elle suit ; le couvrir la bloque.",
"Push": "Onde de gravit\u00e9 : attaque de pouvoir \u00e0 distance, {0} force, puis sauvegarde de STR ou repouss\u00e9e jusqu'\u00e0 3 m. D\u00e9g\u00e2ts +1d8 aux niveaux 5, 11 et 17.",
"Restore Pattern": "Au toucher, efface les marqueurs surnaturels d'une attaque ou d'un pouvoir (comme Corrupt Pattern) sur une cr\u00e9ature ou un objet ; sur une arme am\u00e9lior\u00e9e, le marqueur reste mais l'harmonisation est rompue.",
"Electric Surge": "Pointe \u00e9lectrique : attaque de forge \u00e0 distance qui ignore les abris ; touch\u00e9e, la cible subit {0} foudre et perd son abri jusqu'au d\u00e9but de son prochain tour. D\u00e9g\u00e2ts +1d8 aux niveaux 5, 11 et 17.",
"Remote Connection": "Un appareil \u00e9lectronique visible \u00e0 port\u00e9e, non port\u00e9 et dot\u00e9 de commandes : des commandes virtuelles apparaissent et tu l'utilises comme si tu \u00e9tais devant. Un appareil \u00e0 la fois ; pas s'il est d\u00e9j\u00e0 utilis\u00e9.",
"Synaptic Recoil": "Retour psychique sur une cr\u00e9ature : sauvegarde de WIS, {0} psychiques et elle utilise sa r\u00e9action pour s'\u00e9loigner au maximum (moiti\u00e9 des d\u00e9g\u00e2ts sans fuite si r\u00e9ussite). Immunis\u00e9e aux d\u00e9g\u00e2ts psychiques = r\u00e9ussite. +1d6 par rang au-dessus de 1.",
"Decipher Languages": "Tu comprends le sens litt\u00e9ral de toute langue parl\u00e9e et \u00e9crite (\u00e0 1,5 m du texte, 1 min par page) ; ne d\u00e9chiffre ni messages secrets, ni symboles uniques, ni code de programmation non destin\u00e9 \u00e0 communiquer.",
"Illusory Point": "Distorsion spatiale qui \u00e9met un son ou l'image d'un objet \u00e0 port\u00e9e pendant la dur\u00e9e. Le son va du murmure au cri (ta voix, une autre, un rugissement, des tambours\u2026), continu ou ponctuel. Fin si tu la renvoies (action) ou relances le pouvoir.",
"Black Hat": "Avantage aux tests d'INT avec un hacker's kit pour casser le chiffrement ou la s\u00e9curit\u00e9 d'un syst\u00e8me inconnu ; tu peux forcer les protections de rang 2 ou moins (Magnetic Seal, Programmed Trigger) par un test d'INT (hacker's kit) contre le DD de leur auteur. Au rang 3+ : aussi System Lock et les protections de rang \u2264 celui utilis\u00e9.",
"Analyze Device": "Au toucher (1 minute), tu d\u00e9couvres toutes les commandes et fonctions \u00e9lectroniques ou m\u00e9caniques d'un automate, d'une construction, d'un appareil, d'une machine ou d'un v\u00e9hicule, et sais l'activer et l'utiliser de fa\u00e7on basique. Les fonctions avanc\u00e9es et l'acc\u00e8s aux donn\u00e9es demandent encore des tests (au choix du MJ).",
"Trauma": "Rupture dans le corps d'une cr\u00e9ature \u00e0 ta port\u00e9e : attaque de forge au corps \u00e0 corps, 3d10 n\u00e9crotiques. +1d10 par rang au-dessus de 1.",
 "Conduit Transfer": "Tu touches un appareil, un port ou un conduit relié à une source d'énergie ou à des lignes de données, et tu te téléportes le long de ce réseau jusqu'à un autre point visible à portée qui y est relié : 1,5 m de déplacement, tu réapparais à 1,5 m de l'objet d'arrivée.",
 "Crippling Sphere": "Sphère de 6 m de rayon de distorsion psychique, qui traverse les objets ; zone très obscurcie. Une créature entièrement dedans au début de son tour fait une sauvegarde de CON ; échec : neutralisée jusqu'au début de son prochain tour. Réussite automatique pour les créatures immunisées aux dégâts psychiques ou qui ne dépendent pas de la vue (perception des vibrations, vision aveugle).",
 "Bishop's Deviation": "Les créatures choisies, visibles et qui t'entendent : sauvegarde de WIS (réussite automatique si immunisées au charme) ou affectées. En action bonus à chacun de tes tours, tu désignes une direction horizontale : à leur prochain tour, elles doivent s'y déplacer au maximum (elles peuvent agir avant). Après ce déplacement, nouvelle sauvegarde de WIS pour mettre fin à l'effet.",
 "Force Field": "Barrière invisible (sphère ou dôme de 3 m de rayon, ou 10 panneaux de 3 x 3 m) : rien ne la traverse physiquement, ni les déplacements extradimensionnels ; immunisée aux dégâts et à Unravel Effect, mais détruite par Disintegrate.",
 "Molecular Agitation": "Un objet manufacturé en métal ou plastique renforcé (arme, armure, boîtier ; pas un mur ni une coque) chauffe : une créature en contact subit 2d8 feu, et de nouveau en action bonus à tes tours suivants. Celle qui le tient ou le porte fait une sauvegarde de CON ou le lâche ; si elle le garde, désavantage aux attaques et tests jusqu'à ton prochain tour. +1d8 par rang au-dessus de 2.",
 "Tractor Beam": "Un drone apparaît à portée : il tire sur une créature visible à 9 m de lui, sauvegarde de DEX ou attirée de 6 m vers le drone. Action bonus à chacun de tes tours : nouveau tir, sur la même créature ou une autre.",
 "Veiled Observer": "Orbe invisible qui te transmet ce qu'il voit (vision normale et dans le noir à 9 m, dans toutes les directions). Action : le déplacer de 9 m, sans limite de distance ; il ne peut ni entrer dans l'orbite d'une planète ni en sortir, ni quitter le système stellaire, et passe par une ouverture de 2,5 cm."
};

  const toks = (ENR[n].match(/\{\d\}/g) || []).length;
  if (tp && tp[1] && toks === tp[1].length){ if (tp[0]) tp[0] = ENR[n]; else D.GIST[n] = ENR[n]; }
  else if (tp && toks === 0){ D.GIST[n] = ENR[n]; delete D.TPL[n]; }
  else if (!tp && toks === 0) D.GIST[n] = ENR[n]; }); })();

    C2.feats.forEach(f => { const nm = f[1].replace(/\s*\(.*\)$/, ""); const k = normName(nm); map[k] = map[k] || []; if (!map[k].includes("feat:" + c + ":" + nm)) map[k].push("feat:" + c + ":" + nm); });

}

function bindShip(m){
  m.addEventListener("input", e => { const t = e.target, ds = t.dataset, sh = shipDB();
    if (ds.sf){ sh[ds.sf] = t.value; if (ds.sf === "nom"){ const h1 = m.querySelector(".sband h1"); if (h1) h1.textContent = t.value || "Vaisseau"; } }
    else if (ds.sw){ const [i, j] = ds.sw.split(",").map(Number); sh.weapons[i][j] = t.value; }
    else if (ds.sc){ const [i, j] = ds.sc.split(",").map(Number); sh.cargo[i][j] = t.value; }
    else if (ds.shn){ (sh.crew[ds.shn] = sh.crew[ds.shn] || {}).nom = t.value; }
    else if (ds.shm){ const [r, a] = ds.shm.split(","); const c = sh.crew[r] = sh.crew[r] || {}; c.m = c.m || {}; c.m[a] = t.value; }
    else if (ds.shpb){ (sh.crew[ds.shpb] = sh.crew[ds.shpb] || {}).pb = t.value; }
    else return; save(); });
  m.addEventListener("change", e => { const t = e.target, ds = t.dataset, sh = shipDB();
    if (t.id === "shipSel"){ DB.curShip = t.value; save(); openShip(); return; }
    if (ds.shr != null){ const c = sh.crew[ds.shr] = sh.crew[ds.shr] || {}; c.ref = t.value; delete c.prof; }
    else if (ds.shp != null){ (sh.crew[ds.shp] = sh.crew[ds.shp] || {}).prof = t.checked; }
    else if ("scap" in ds){ sh.capBonus = t.checked; }
    else if (ds.sfail != null){ sh.fails = sh.fails || []; sh.fails[+ds.sfail] = t.checked; }
    else if (ds.sjury != null){ sh.jury = sh.jury || [false, false]; sh.jury[+ds.sjury] = t.checked; save(); return; }
    else if (ds.shg != null){ (sh.crew["g" + ds.shg] = sh.crew["g" + ds.shg] || {}).ref = t.value; }
    else if (!(ds.sf || ds.sw || ds.sc || ds.shn || ds.shm || ds.shpb || "scap" in ds || ds.sfail != null)) return;
    save(); openShip(); });
  m.addEventListener("click", e => { const id = e.target.id;
    if (id === "shipClose" || id === "shipClose2") closeShip();
    if (id === "shipNew"){ const s = blankShip(); DB.ships[s.id] = s; DB.curShip = s.id; save(); openShip(); }
    if (id === "shipDup"){ const s = JSON.parse(JSON.stringify(shipDB())); s.id = "s" + uid(); s.nom += " (copie)"; DB.ships[s.id] = s; DB.curShip = s.id; save(); openShip(); }
    if (id === "shipDel") uiConfirm("Supprimer le vaisseau \u00ab " + shipDB().nom + " \u00bb ?", "Supprimer").then(ok => { if (!ok) return; delete DB.ships[DB.curShip]; DB.curShip = null; save(); openShip(); });

    if (id === "sFailRoll"){ const r = 1 + Math.floor(Math.random() * 20), idx = SYS_FAIL.findIndex(([rg]) => { const [a, b] = rg.split("-").map(Number); return r >= a && r <= (b || a); }); const sh = shipDB(); sh.fails = sh.fails || []; sh.fails[idx] = true; save(); openShip(); uiAlert("d20 = " + r + " : " + SYS_FAIL[idx][1]); }
    if (id === "shipUnNpc"){ const sh = shipDB(); sh.npc = false; save(); openShip(); }
    if (id === "shipPdf") shipPdfAsk();
    if (id === "shipTpl"){ if ($("picker")) closePicker(); else openShipTpl(e.target); }
    if (id === "cargoAdd"){ shipDB().cargo.push(["", ""]); save(); openShip(); }
    if (e.target.dataset.cargorm != null){ shipDB().cargo.splice(+e.target.dataset.cargorm, 1); save(); openShip(); }
    if (id === "wpnAdd"){ shipDB().weapons.push(["", "", "", "", "", "", "", ""]); save(); openShip(); }
    if (e.target.dataset.wpnrm != null){ const sh = shipDB(), i = +e.target.dataset.wpnrm; sh.weapons.splice(i, 1); const cr = {}; Object.keys(sh.crew).forEach(k2 => { if (/^g\d+$/.test(k2)){ const n2 = +k2.slice(1); if (n2 < i) cr[k2] = sh.crew[k2]; else if (n2 > i) cr["g" + (n2 - 1)] = sh.crew[k2]; } else cr[k2] = sh.crew[k2]; }); sh.crew = cr; save(); openShip(); } });
}
function shipPdfAsk(){ const m = document.createElement("div"); m.className = "modal"; m.style.zIndex = 70;
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" style="width:min(460px,100%)"><h2>Exporter le vaisseau en PDF</h2>

  m.addEventListener("click", e => { const x = e.target.dataset && e.target.dataset.x; if (x === undefined && e.target !== m) return; const inc = m.querySelector("#spMan").checked; m.remove(); if (x === "1") shipPdf(inc); });
  document.body.appendChild(m); }
async function shipPdf(withMan){ const sh = shipDB(); setStatus("Pr\u00e9paration du PDF du vaisseau\u2026");
  try { document.body.classList.add("exporting"); const { jsPDF } = window.jspdf, pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });
    const els = [$("shipSheet"), withMan === false ? null : $("shipSheet2")].filter(Boolean);
    for (let q = 0; q < els.length; q++){ const cv = await html2canvas(els[q], { scale: 2, backgroundColor: "#ffffff", onclone: flattenForPdf }); if (q) pdf.addPage();
      const w = 297, h = cv.height * w / cv.width, s = Math.min(1, 210 / h); pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", (297 - w * s) / 2, 0, w * s, h * s); }
    const body = new Uint8Array(pdf.output("arraybuffer")), tail = new TextEncoder().encode("\n%EG-SHIP-DATA:" + b64(JSON.stringify(sh)) + "\n"), data = new Uint8Array(body.length + tail.length); data.set(body, 0); data.set(tail, body.length);
    const name = "Vaisseau_" + (sh.nom || "vaisseau").replace(/[^\w\-]+/g, "_") + ".pdf";
    if (downloads){ await downloads.save({ filename: name, data }); } else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/pdf" })); a.download = name; a.click(); }
    setStatus("PDF du vaisseau enregistr\u00e9"); }
  catch(err){ setStatus(err && err.code === "declined" ? "Enregistrement annul\u00e9" : "Export impossible ici"); }
  finally { document.body.classList.remove("exporting"); }
}

function gearFind(name){ const n = eqNorm(String(name || "").replace(/^\s*-\s*/, "")); if (!n) return null;
  const base = eqNorm(n.replace(/\(.*?\)/g, ""));
  return GEAR.find(g => eqNorm(g[0]) === n) || GEAR.find(g => eqNorm(g[0]) === base) || GEAR.find(g => eqNorm(g[0].replace(/\(.*?\)/g, "")) === base) || null; }
function gearDesc(name){ const nm = String(name || "").replace(/^\s*-\s*/, "").trim(); if (PACK_FR[nm]) return PACK_FR[nm] + " Contenu ci-dessous.";
  const g = gearFind(nm); if (g) return g[2]; const w = eqFind(nm, WEAPONS) || eqFind(nm, ARMORS); return w ? (w.length === 7 ? (w[2] ? w[2] + " " + w[3] : "Grenade") + (w[4] ? " \u00b7 " + ft2mR(w[4]) : "") : "Armure / bouclier") : ""; }

function picksAt(lv){

  const at = (arr, k) => (arr && k >= 1 ? (arr[k - 1] || 0) : 0);
  const autoP = (c.auto_prime || []).length;
  let n = at(c.prime, lv) - at(c.prime, lv - 1) - (lv === 1 ? autoP : 0);
  if (c.sys === "prepared"){ const pc = k => (k >= 1 && maxRank(k) > 0 ? prepCount(k) : 0); n += pc(lv) - pc(lv - 1); }
  else n += at(c.known, lv) - at(c.known, lv - 1);
  if (c.mastery && Object.values(MASTERY_LV).includes(lv)) n += 1;
  if (c.memory_interface && S.interface === "Memory Interface" && lv === 3) n += 3;
  return Math.max(0, n);
}
function syncCards(){

  for (let lv = 1; lv <= l; lv++){

    for (let k = have; k < need; k++) S.cards.push(MC ? { l: lv, n: "", c2: 1 } : { l: lv, n: "" });
    let extra = S.cards.filter(cd => me(cd) && cd.l === lv).length - need;
    while (extra > 0){ const ix = S.cards.findIndex(cd => me(cd) && cd.l === lv && !cd.n); if (ix < 0) break; S.cards.splice(ix, 1); extra--; }

      const k = txt.lastIndexOf(MARK); if (k < 0) throw new Error("nomark");
      const raw = txt.slice(k + MARK.length).split("\n")[0].trim(); const ch = JSON.parse(unb64(raw));
      if (!ch || !ch.classe || !D.CLASSES[ch.classe]) throw new Error("bad");
      if (ch.avatar === null || ch.avatar === undefined) ch.avatar = AVATAR0;
      const nl = ch._lib ? Object.keys(ch._lib).filter(k => !DB.lib[k]).length : 0; if (ch._lib){ DB.lib = Object.assign({}, ch._lib, DB.lib || {}); delete ch._lib; }
      ch.id = uid(); if (DB.chars[ch.id]) ch.id = uid(); DB.chars[ch.id] = ch; DB.current = ch.id; S = ch; save(); render();
      if (nl) setTimeout(() => setStatus("Fiche importée + " + nl + " description(s) ajoutée(s) à la bibliothèque"), 50);
      setStatus("Fiche « " + ch.nom + " » importée");
    } catch(err){ uiAlert("Ce PDF ne contient pas de données de fiche. Seuls les PDF exportés depuis cette page peuvent être réimportés."); }
  };
  rd.readAsArrayBuffer(f); e.target.value = "";
});
render();

</script>
